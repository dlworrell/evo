name: Persistent Orchestration Trace Sync

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-trace-sync.yml'
      - '.github/scripts/orchestration_trace_integration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Integrate persistent worker trace
        run: python3 .github/scripts/orchestration_trace_integration.py
      - name: Canonicalize trace integration
        run: >-
          clang-format -i
          src/internal/project_search_orchestration.h
          src/internal/project_search_orchestration_trace.h
          src/project_search_orchestration_trace.c
          src/project_search.c
          tests/project_search_test.c
      - name: Commit integration and remove helper
        run: |
          rm -f .github/workflows/orchestration-trace-sync.yml .github/scripts/orchestration_trace_integration.py
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A \
            .github/workflows/orchestration-trace-sync.yml \
            .github/scripts/orchestration_trace_integration.py \
            src/internal/project_search_orchestration.h \
            src/internal/project_search_orchestration_trace.h \
            src/project_search_orchestration_trace.c \
            src/project_search.c \
            tests/project_search_test.c \
            CMakeLists.txt \
            Makefile.am
          if ! git diff --cached --quiet; then
            git commit -m 'feat: retain complete bounded orchestration traces'
            git push origin HEAD:agent/bounded-source-orchestration
          fi
      - name: Verify focused CMake tests
        run: |
          cmake -S . -B build-trace -DCMAKE_C_COMPILER=clang
          cmake --build build-trace --target evo_project_search_test evo_project_orchestration_test evo_project_orchestration_checkpoint_test --parallel 2
          ctest --test-dir build-trace -R '^evo_project_(search|orchestration|orchestration_checkpoint)_test$' --output-on-failure
      - name: Independent orchestration validation
        run: python3 tests/validate_project_orchestration.py
