name: Project Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-clang:
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure project-analysis foundation
        run: >-
          cmake -S . -B build/project-analysis-cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build and run the normative analysis target
        run: |
          cmake --build build/project-analysis-cmake \
            --target evo_project_analysis_test --parallel
          ctest --test-dir build/project-analysis-cmake \
            --output-on-failure -R '^evo_project_analysis_test$'

      - name: Validate the analysis schema
        run: |
          python3 -m json.tool \
            docs/schemas/evo-project-analysis-v1.schema.json >/dev/null
          python3 tests/validate_project_analysis.py

  autotools-gcc:
    runs-on: ubuntu-24.04
    env:
      CC: gcc
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Autotools dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Configure project-analysis foundation
        run: |
          autoreconf -fi
          mkdir -p build/project-analysis-autotools
          cd build/project-analysis-autotools
          ../../configure --enable-warnings-as-errors

      - name: Build and run the normative analysis target
        run: |
          make -C build/project-analysis-autotools \
            tests/evo_project_analysis_test
          build/project-analysis-autotools/tests/evo_project_analysis_test

      - name: Validate the analysis schema
        run: |
          python3 -m json.tool \
            docs/schemas/evo-project-analysis-v1.schema.json >/dev/null
          python3 tests/validate_project_analysis.py
