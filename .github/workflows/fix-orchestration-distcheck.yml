name: Fix Orchestration Distcheck Manifest

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/fix-orchestration-distcheck.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Add private batch headers to distribution manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Makefile.am')
          text = path.read_text()
          marker = '\tsrc/internal/bounded_run.h \\\n'
          addition = ('\tsrc/internal/bounded_run.h \\\n'
                      '\tsrc/internal/batch_evaluation.h \\\n'
                      '\tsrc/internal/run_batch.h \\\n')
          if 'src/internal/batch_evaluation.h' not in text:
              if marker not in text:
                  raise SystemExit('bounded_run noinst header marker missing')
              text = text.replace(marker, addition, 1)
          if 'src/internal/run_batch.h' not in text:
              raise SystemExit('run_batch header insertion failed')
          path.write_text(text)
          PY
      - name: Commit distribution-manifest correction
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add Makefile.am
          git commit -m 'build: distribute batch evaluation headers'
          git push origin HEAD:agent/bounded-source-orchestration
