name: Security

# Language-matched security checks on every change (EVO ADR-0049, owner
# decision 2026-11-07). A changes job finds which languages the change touches;
# each one gets its own check:
#
#   C and C++                 AES-SEC-001 governance (its own workflow) and CodeQL
#   JavaScript/TypeScript,    CodeQL, one analysis per language
#   Python, Java/Kotlin,
#   C#, Go, Rust, Ruby,
#   GitHub Actions
#   Shell                     ShellCheck
#   Dependencies (any)        dependency review on pull requests
#
# CodeQL is report-only, as Catylist ADR-0009 requires until a profile is
# promoted: results go to code scanning, and high or critical results (security
# severity 7.0 or more) in the files a change touches are annotated as warnings.
# A failed, partial or missing analysis fails the job (indeterminate, never a
# clean pass). The CodeQL action and CLI are pinned (ADR-0009 decision 4).
# ShellCheck and dependency review fail on their findings.
# Everything runs on hosted runners and never on pull_request_target.

on:
  pull_request:
  push:
    branches: [main, dev-daily, fitment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  EVENT: ${{ github.event_name }}
  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: Changed languages
    runs-on: ubuntu-24.04
    outputs:
      codeql: ${{ steps.detect.outputs.codeql }}
      shell: ${{ steps.detect.outputs.shell }}
      uncovered: ${{ steps.detect.outputs.uncovered }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit tests for the security tooling
        run: python3 -m unittest discover -s tools/ci_security -p 'test_*.py'
      - id: detect
        name: Detect changed languages
        run: python3 tools/ci_security/changed_languages.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Note languages without a check
        if: steps.detect.outputs.uncovered != '[]'
        env:
          UNCOVERED: ${{ steps.detect.outputs.uncovered }}
        run: echo "::notice::No security analysis runs here for $UNCOVERED (CodeQL Swift needs a macOS build)."

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.gz
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: Changed files
        run: python3 tools/ci_security/changed_languages.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" --list changed.txt > /dev/null
      - name: Flag high and critical results in changed files (report-only)
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if (( ${#files[@]} == 0 )); then
            echo "::error::CodeQL wrote no SARIF for $LANGUAGE"
            exit 1
          fi
          if [[ "$EVENT" == pull_request || "$EVENT" == push ]] && [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            python3 tools/ci_security/sarif_gate.py "${files[@]}" --mode report --changed changed.txt --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/ci_security/sarif_gate.py "${files[@]}" --mode report --summary "$GITHUB_STEP_SUMMARY"
          fi

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ShellCheck changed shell scripts
        run: |
          set -euo pipefail
          python3 tools/ci_security/changed_languages.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" --list changed.txt > /dev/null
          if [[ -s changed.txt ]]; then
            mapfile -t scripts < <(grep -E '\.(sh|bash)$' changed.txt | while read -r f; do [[ -f "$f" ]] && echo "$f"; done)
          else
            mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          fi
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts to check."
            exit 0
          fi
          shellcheck --version
          shellcheck --severity=warning "${scripts[@]}"

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
