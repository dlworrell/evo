name: Verify Repository

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev-daily, fitment]

permissions:
  contents: read

jobs:
  # Required checks cannot use paths-ignore (a check that never reports blocks
  # merging), so a changes job decides: a rea/-only change skips EVO's native
  # checks, which then report as skipped (ADR-0049).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      evo_native: ${{ steps.detect.outputs.evo_native }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci_security/changed_languages.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.evo_native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify AES-BLD profile projection
        run: python3 scripts/verify_aes_bld_profile.py
      - name: Verify GitHub Actions runtime floor
        run: python3 scripts/verify_github_actions_runtime.py
      - name: Configure EVO
        run: cmake -S . -B build/evo -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build EVO
        run: cmake --build build/evo --parallel
      - name: Test EVO
        run: ctest --test-dir build/evo --output-on-failure
      - name: Retain repository verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification-report
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("build/verification-report")
          evidence = {
              "schema": "catalyst.repository-verification.v1",
              "repository": os.environ.get("GITHUB_REPOSITORY", "local"),
              "commit": os.environ.get("GITHUB_SHA", "local"),
              "configure": "passed",
              "build": "passed",
              "tests": "passed",
              "project_zero": "not-applicable-after-engineering-ready",
          }
          (output / "verification.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          (output / "executive-summary.md").write_text(
              "# Repository Verification\n\n"
              f"Commit: `{evidence['commit']}`\n\n"
              "Configure, build, and tests: **passed**\n\n"
              "Project Zero: completed initial onboarding; not a routine gate.\n",
              encoding="utf-8",
          )
          PY
      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/verification-report/executive-summary.md ]]; then
            cat build/verification-report/executive-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-report-${{ github.run_id }}
          path: |
            build/verification-report/
            build/evo/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 90
