name: Verify Repository

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify AES-BLD profile projection
        run: python3 scripts/verify_aes_bld_profile.py
      - name: Verify GitHub Actions runtime floor
        run: python3 scripts/verify_github_actions_runtime.py
      - name: Configure EVO
        run: cmake -S . -B build/evo -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build EVO
        run: cmake --build build/evo --parallel
      - name: Test EVO
        run: ctest --test-dir build/evo --output-on-failure
      - name: Retain repository verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification-report
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("build/verification-report")
          evidence = {
              "schema": "catalyst.repository-verification.v1",
              "repository": os.environ.get("GITHUB_REPOSITORY", "local"),
              "commit": os.environ.get("GITHUB_SHA", "local"),
              "configure": "passed",
              "build": "passed",
              "tests": "passed",
              "project_zero": "not-applicable-after-engineering-ready",
          }
          (output / "verification.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          (output / "executive-summary.md").write_text(
              "# Repository Verification\n\n"
              f"Commit: `{evidence['commit']}`\n\n"
              "Configure, build, and tests: **passed**\n\n"
              "Project Zero: completed initial onboarding; not a routine gate.\n",
              encoding="utf-8",
          )
          PY
      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/verification-report/executive-summary.md ]]; then
            cat build/verification-report/executive-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-report-${{ github.run_id }}
          path: |
            build/verification-report/
            build/evo/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 90
