name: Repair Orchestration Resume Cppcheck

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-cppcheck-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Fix observer null-check ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/project_orchestration_resume_test.c')
          text = path.read_text()
          old = '''    test_checkpoint_log_t *log = context;\n    const unsigned char *bytes = checkpoint;\n    const size_t generation = (size_t)view->current_generation;\n    size_t index;\n\n    if (log == NULL || checkpoint == NULL || view == NULL ||\n        generation >= TEST_SNAPSHOT_COUNT ||\n        checkpoint_size > TEST_CHECKPOINT_CAPACITY) {\n        test_failures += 1;\n        return;\n    }\n'''
          new = '''    test_checkpoint_log_t *log = context;\n    const unsigned char *bytes = checkpoint;\n    size_t generation;\n    size_t index;\n\n    if (log == NULL || checkpoint == NULL || view == NULL ||\n        checkpoint_size > TEST_CHECKPOINT_CAPACITY) {\n        test_failures += 1;\n        return;\n    }\n    generation = (size_t)view->current_generation;\n    if (generation >= TEST_SNAPSHOT_COUNT) {\n        test_failures += 1;\n        return;\n    }\n'''
          if old not in text:
              raise SystemExit('observer block marker missing or already changed')
          path.write_text(text.replace(old, new, 1))
          PY
          clang-format -i tests/project_orchestration_resume_test.c
      - name: Verify focused static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr -I include tests/project_orchestration_resume_test.c
      - name: Commit non-workflow fix
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add tests/project_orchestration_resume_test.c
          git commit -m 'test: validate checkpoint view before resume access'
          git push origin HEAD:agent/bounded-source-orchestration
