name: Issue 114 AES-SEC Cleanup

on:
  push:
    branches:
      - agent/issue-114-production-providers

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[aes-sec-cleanup]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out provider branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-114-production-providers

      - name: Replace newly introduced review primitives
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "src/project_provider_clang.c",
              "    (void)memcpy(copy, value, size);\n",
              "    {\n"
              "        size_t index;\n\n"
              "        for (index = 0U; index < size; index += 1U) {\n"
              "            copy[index] = value[index];\n"
              "        }\n"
              "    }\n",
          )

          replace_exact(
              "src/project_provider_sandbox.c",
              "        } else if (directory_length < sizeof(candidate)) {\n"
              "            (void)memcpy(candidate, cursor, directory_length);\n"
              "            position = directory_length;\n"
              "        }\n",
              "        } else if (directory_length < sizeof(candidate)) {\n"
              "            size_t index;\n\n"
              "            for (index = 0U; index < directory_length; index += 1U) {\n"
              "                candidate[index] = cursor[index];\n"
              "            }\n"
              "            position = directory_length;\n"
              "        }\n",
          )
          replace_exact(
              "src/project_provider_sandbox.c",
              "        if (position > 0U && program_length < sizeof(candidate) - position) {\n"
              "            (void)memcpy(candidate + position, program, program_length);\n"
              "            position += program_length;\n",
              "        if (position > 0U && program_length < sizeof(candidate) - position) {\n"
              "            size_t index;\n\n"
              "            for (index = 0U; index < program_length; index += 1U) {\n"
              "                candidate[position + index] = program[index];\n"
              "            }\n"
              "            position += program_length;\n",
          )
          replace_exact(
              "src/project_provider_sandbox.c",
              "    const size_t length = equal == NULL ? 0U : (size_t)(equal - entry);\n"
              "    char *name;\n",
              "    const size_t length = equal == NULL ? 0U : (size_t)(equal - entry);\n"
              "    char *name;\n"
              "    size_t index;\n",
          )
          replace_exact(
              "src/project_provider_sandbox.c",
              "    (void)memcpy(name, entry, length);\n",
              "    for (index = 0U; index < length; index += 1U) {\n"
              "        name[index] = entry[index];\n"
              "    }\n",
          )

          tests = {
              "tests/project_provider_clang_ast_test.c": 1,
              "tests/project_provider_clang_test.c": 3,
              "tests/project_provider_sandbox_test.c": 2,
          }
          for path, expected in tests.items():
              p = Path(path)
              text = p.read_text()
              count = text.count("snprintf(")
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} snprintf calls, found {count}")
              if '#include "internal/project_runtime.h"\n' not in text:
                  marker = '#include "internal/project_provider_sandbox.h"\n'
                  if marker not in text:
                      raise SystemExit(f"{path}: provider sandbox include marker missing")
                  text = text.replace(
                      marker,
                      marker + '#include "internal/project_runtime.h"\n',
                      1,
                  )
              text = text.replace("snprintf(", "evo_project_format(")
              p.write_text(text)
          PY

      - name: Prove cleanup scope
        run: |
          if grep -nE '\b(memcpy|snprintf)[[:space:]]*\(' \
              src/project_provider_clang.c \
              src/project_provider_sandbox.c \
              tests/project_provider_clang_ast_test.c \
              tests/project_provider_clang_test.c \
              tests/project_provider_sandbox_test.c; then
            echo 'New review primitive remained after asserted cleanup.' >&2
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/project_provider_clang.c \
            src/project_provider_sandbox.c \
            tests/project_provider_clang_ast_test.c \
            tests/project_provider_clang_test.c \
            tests/project_provider_sandbox_test.c
          git diff --cached --check
          git commit -m 'security: remove new AES-SEC review primitives [aes-sec-cleanup]'
          git push origin HEAD:agent/issue-114-production-providers
