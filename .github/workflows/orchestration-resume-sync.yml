name: Orchestration Resume Sync

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-resume-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Integrate resume differential
        run: |
          python3 .github/scripts/orchestration_resume_integration.py
          clang-format -i tests/project_orchestration_resume_test.c
      - name: Commit integration and remove helpers
        run: |
          rm -f .github/scripts/orchestration_resume_integration.py
          rm -f .github/workflows/orchestration-resume-sync.yml
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A
          git commit -m 'test: prove bounded orchestration resume equivalence'
          git push origin HEAD:agent/bounded-source-orchestration
      - name: Verify CMake Clang resume target
        run: |
          cmake -S . -B build-resume -DCMAKE_C_COMPILER=clang -DEVO_ENABLE_SANITIZERS=ON
          cmake --build build-resume --target evo_project_orchestration_resume_test --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-resume -R '^evo_project_orchestration_resume_test$' --output-on-failure
          python3 tests/validate_project_orchestration.py
      - name: Verify Autotools GCC resume target
        run: |
          autoreconf -fi
          ./configure CC=gcc
          make -j2 tests/evo_project_orchestration_resume_test
          make check TESTS='tests/evo_project_orchestration_resume_test'
