name: Measurement Evidence Sync

on:
  push:
    branches:
      - agent/reproducible-candidate-fitness
    paths:
      - '.github/workflows/measurement-evidence-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reproducible-candidate-fitness
      - name: Complete canonical and human-readable evidence
        run: python3 .github/measurement_evidence_sync.py
      - name: Canonicalize measurement C formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format -i \
            src/internal/project_measurement.h \
            src/project_measurement_model.c \
            src/project_measurement_runtime.c \
            tests/project_measurement_test.c
      - name: Commit complete audit projection
        run: |
          git config user.name "Donovan Worrell"
          git config user.email "donovan.worrell@just-a-geek.com"
          git rm .github/workflows/measurement-evidence-sync.yml .github/measurement_evidence_sync.py
          git add src/internal/project_measurement.h src/project_measurement_model.c src/project_measurement_runtime.c docs/schemas/evo-project-measurement-v1.schema.json tests/project_measurement_test.c tests/validate_project_measurement.py
          git commit -m "fix: make candidate fitness evidence reconstructible"
          git push origin HEAD:agent/reproducible-candidate-fitness
