name: Measurement Condition Sync

on:
  push:
    branches:
      - agent/reproducible-candidate-fitness
    paths:
      - '.github/workflows/measurement-condition-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reproducible-candidate-fitness
      - name: Retain comparable-condition evidence
        run: python3 .github/measurement_condition_sync.py
      - name: Canonicalize measurement C formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format -i \
            src/project_measurement.c \
            src/project_measurement_model.c \
            src/project_measurement_runtime.c \
            tests/project_measurement_test.c
      - name: Commit comparable-condition fix
        run: |
          git config user.name "Donovan Worrell"
          git config user.email "donovan.worrell@just-a-geek.com"
          git rm .github/workflows/measurement-condition-sync.yml .github/measurement_condition_sync.py
          git add src/project_measurement.c src/project_measurement_model.c src/project_measurement_runtime.c tests/project_measurement_test.c tests/validate_project_measurement.py
          git commit -m "fix: retain incomparable measurement evidence"
          git push origin HEAD:agent/reproducible-candidate-fitness
