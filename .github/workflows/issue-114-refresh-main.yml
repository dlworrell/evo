name: Issue 114 Refresh Main

on:
  push:
    branches:
      - agent/issue-114-production-providers

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-114-production-providers
          fetch-depth: 0
      - name: Reconcile production providers with v0.43 main
        run: python3 .github/scripts/issue-114-refresh.py
