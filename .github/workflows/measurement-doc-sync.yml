name: Measurement Documentation Sync

on:
  push:
    branches:
      - agent/reproducible-candidate-fitness
    paths:
      - '.github/workflows/measurement-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reproducible-candidate-fitness
      - name: Synchronize EVO 0.40 implementation boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing documentation anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # README governance and implemented source-optimizer boundary.
          replace(
              'README.md',
              '- `docs/adr/ADR-0040-isolated-candidate-correctness-gates.md`\n',
              '- `docs/adr/ADR-0040-isolated-candidate-correctness-gates.md`\n- `docs/adr/ADR-0041-reproducible-candidate-performance-fitness.md`\n',
          )
          replace(
              'README.md',
              '''complete ordered gate trace. EVO-HRA-012 retains this assurance-specific
          audit.
''',
              '''complete ordered gate trace. EVO-HRA-012 retains this assurance-specific
          audit. ADR-0041 assesses 0.40.0 candidate performance measurement: exact
          ordered warmup/recorded samples and declared measurement policy remain
          authority, condition identity binds hardware/toolchain/environment/dataset
          and binary provenance, incomplete or unstable evidence yields no ranking
          fitness, and JSON/Markdown preserve every sample, exclusion, aggregate, and
          fitness derivation. EVO-HRA-013 retains this measurement-specific audit.
''',
          )
          replace(
              'README.md',
              '- Reproducible baseline-versus-candidate performance measurement\n',
              '- Implemented reproducible baseline-versus-candidate performance measurement and finite fitness mapping\n',
          )
          replace(
              'README.md',
              '''candidate assurance with exact ordered fast/finalist gate authority through
          a caller-supplied isolated execution provider. Performance measurement,
          whole-run orchestration, and the installed executable remain dependency-
          ordered roadmap work; their absence is an explicit boundary, not an implicit
          feature claim.
''',
              '''candidate assurance with exact ordered fast/finalist gate authority through
          a caller-supplied isolated execution provider, and 0.40.0 reproducible
          baseline-versus-candidate measurement with ordered raw samples, explicit
          condition identity, deterministic aggregation, stability/tolerance policy,
          and finite EVO fitness only for complete stable evidence. Whole-run
          orchestration and the installed executable remain dependency-ordered roadmap
          work; their absence is an explicit boundary, not an implicit feature claim.
''',
          )
          replace(
              'README.md',
              '''installed-core sources, 21 private source-foundation sources, and 38
          normative tests.''',
              '''installed-core sources, 24 private source-foundation sources, and 39
          normative tests.''',
          )
          p = Path('README.md')
          text = p.read_text()
          start = '**Current implementation boundary:** EVO 0.39.0 packages the deterministic\n'
          end = 'final stabilization (#56) remain later dependency-ordered work.\n'
          si = text.find(start)
          ei = text.find(end, si)
          if si < 0 or ei < 0:
              raise SystemExit('README current-boundary paragraph anchor missing')
          ei += len(end)
          current = '''**Current implementation boundary:** EVO 0.40.0 packages the deterministic
          evolutionary-search core plus the private source-optimizer foundations for
          strict C-project ingestion, immutable baselines, normalized Clang/LLVM
          analysis, canonical transformation recipes, three AST-aware C
          transformations, isolated candidate materialization, candidate assurance,
          and reproducible candidate performance measurement. Measurement consumes only
          performance-eligible assurance evidence, executes deterministic paired
          baseline/candidate warmup and recorded requests through a caller-supplied
          provider, binds every sample to one exact condition identity, retains explicit
          exclusions and raw evidence, rejects incomplete or unstable measurements from
          ranking, and derives finite EVO fitness from recorded component values and
          caller-declared weights without changing correctness authority. The boundary
          remains private and uninstalled. Recipe evolution/orchestration (#65-#66),
          product commands and installed executable (#67/#93), artifact publication
          (#68), end-to-end proof (#69), and final stabilization (#56) remain later
          dependency-ordered work.
'''
          p.write_text(text[:si] + current + text[ei:])

          # Roadmap: #64 is implemented and #65 becomes dependency-ready.
          replace('docs/roadmap.md', 'EVO 0.39.0 contains', 'EVO 0.40.0 contains')
          replace(
              'docs/roadmap.md',
              'the first six private source-optimizer foundations:',
              'the first seven private source-optimizer foundations:',
          )
          replace(
              'docs/roadmap.md',
              '''both declared build profiles control champion admission.

          Core issues''',
              '''both declared build profiles control champion admission. The seventh adds
          reproducible baseline-versus-candidate performance measurement: deterministic
          paired sample order, explicit condition identity, bounded warmup/repetition
          policy, visible outlier handling, stability and tolerance checks, and finite
          EVO fitness only when complete stable evidence is available; correctness
          authority remains unchanged from candidate assurance.

          Core issues''',
          )
          replace(
              'docs/roadmap.md',
              '''implements candidate build/correctness assurance. Issue #64 is the next
          dependency-ready source-optimizer implementation work.''',
              '''implements candidate build/correctness assurance. Issue #64 implements
          reproducible candidate performance measurement and fitness. Issue #65 is the
          next dependency-ready source-optimizer implementation work.''',
          )

          # Architecture implementation and HRA boundary.
          replace(
              'docs/architecture.md',
              '''filesystem, network, resource, cleanup, and immutable-input obligations.

          Source genomes''',
              '''filesystem, network, resource, cleanup, and immutable-input obligations.
          Version 0.40.0 adds a private measurement transaction over performance-eligible
          assurance results. It records deterministic paired baseline/candidate samples,
          exact platform/toolchain/environment/dataset/binary condition identity,
          declared outlier/stability/tolerance policy, deterministic aggregates, and
          finite EVO fitness only for complete stable evidence.

          Source genomes''',
          )
          replace(
              'docs/architecture.md',
              '''Correctness and admissibility are hard gates. Performance evidence cannot make
          an invalid candidate valid, and a candidate cannot become the published
          champion until it passes every configured finalist gate.
''',
              '''Correctness and admissibility are hard gates. Performance evidence cannot make
          an invalid candidate valid, and a candidate cannot become the published
          champion until it passes every configured finalist gate. Performance
          measurement consumes only a performance-eligible assurance result. Raw
          ordered samples remain authority; warmups are retained but excluded from
          aggregation, declared exclusions remain visible, and incomplete or unstable
          measurement produces no ranking fitness. Runtime, memory, binary size,
          reliability, and maintainability remain separately reconstructable before
          caller-declared weights derive the scalar EVO fitness.
''',
          )
          replace(
              'docs/architecture.md',
              'Version 0.39.0 contains the evolutionary-search core, its bounded reference',
              'Version 0.40.0 contains the evolutionary-search core, its bounded reference',
          )
          replace(
              'docs/architecture.md',
              '''and private candidate assurance. Candidate process execution remains owned by
          the caller-supplied execution provider; EVO validates the declared policy and
          commits its exact attested outcome rather than pretending to provide a portable
          OS sandbox itself. Target-code measurement, product commands, the installed
          standalone executable, and final optimized-patch artifacts remain planned by
          issues #64 through #69 and #93.''',
              '''private candidate assurance, and private reproducible candidate measurement
          with finite fitness mapping. Candidate process execution and target workload
          sampling remain owned by caller-supplied providers; EVO validates declared
          policy, condition identity, ordered outcomes, and exact evidence rather than
          pretending to provide a portable OS sandbox or universal timing environment.
          Whole-run orchestration, product commands, the installed standalone executable,
          and final optimized-patch artifacts remain planned by issues #65 through #69
          and #93.''',
          )
          replace(
              'docs/architecture.md',
              '''authority. EVO-HRA-012 audits this 0.39.0 boundary. The current implementation
          therefore has no opaque accelerated authority requiring remediation.''',
              '''authority. EVO-HRA-012 audits this 0.39.0 boundary. Candidate measurement
          likewise retains direct bounded workload/sample arrays and exact provider
          outcomes; deterministic medians, exclusions, stability, comparisons, and
          fitness are derived from that complete record, with no cache, sketch, or
          probabilistic ranking authority. EVO-HRA-013 audits this 0.40.0 boundary. The
          current implementation therefore has no opaque accelerated authority requiring
          remediation.''',
          )

          # Algorithms top-level boundary.
          p = Path('docs/algorithms.md')
          text = p.read_text()
          start = 'This document distinguishes algorithms implemented by the reusable\n'
          end = 'next source-optimizer algorithm boundary.\n'
          si = text.find(start)
          ei = text.find(end, si)
          if si < 0 or ei < 0:
              raise SystemExit('algorithms introduction anchor missing')
          ei += len(end)
          intro = '''This document distinguishes algorithms implemented by the reusable
          `catalyst_evo` core from the structured program transformations and evaluation
          algorithm required by the EVO 1.0 source optimizer. Version 0.40.0 implements
          the core plus project ingestion, immutable-baseline preparation, normalized
          Clang/LLVM analysis and hotspot ranking, canonical transformation recipes,
          three AST-aware source-transformation applications, deterministic isolated
          candidate materialization, exact candidate build/correctness assurance, and
          reproducible baseline-versus-candidate performance measurement. The
          measurement algorithm consumes only performance-eligible assurance evidence,
          requests deterministic alternating baseline/candidate warmup and recorded
          samples, binds every provider result to one exact condition fingerprint,
          retains raw samples and declared exclusions, aggregates included samples by
          deterministic median, classifies unstable/incomplete evidence without fitness,
          and maps complete stable runtime/memory/binary/reliability/maintainability
          evidence into finite EVO fitness through explicit caller weights. Recipe
          evolution and whole-run orchestration remain the next source-optimizer
          algorithm boundary.
'''
          p.write_text(text[:si] + intro + text[ei:])

          # Repository metadata.
          replace('repo.yaml', 'status: implemented-0.39.0', 'status: implemented-0.40.0')
          replace(
              'repo.yaml',
              'status: candidate-assurance-implemented-0.39.0',
              'status: performance-measurement-implemented-0.40.0',
          )

          # EVO-001 package boundary; installed core semantics remain unchanged.
          replace('docs/specs/EVO-001-library-contract.md', 'Version: 0.39.0', 'Version: 0.40.0')
          replace(
              'docs/specs/EVO-001-library-contract.md',
              '''core packaged through version 0.39.0. Version 0.39.0 changes no installed
          core semantics; its new implementation is confined to the private source-
          optimizer candidate-assurance foundation.''',
              '''core packaged through version 0.40.0. Version 0.40.0 changes no installed
          core semantics; its new implementation is confined to the private source-
          optimizer candidate-measurement and fitness foundation.''',
          )

          # EVO-002 implemented product-layer boundary.
          replace(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              'Status: Implemented through the 0.39.0 candidate-assurance boundary; draft 1.0 target',
              'Status: Implemented through the 0.40.0 candidate-measurement boundary; draft 1.0 target',
          )
          replace('docs/specs/EVO-002-source-optimizer-contract.md', 'Version: 0.39.0', 'Version: 0.40.0')
          replace(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              'ADR-0039, and ADR-0040',
              'ADR-0039, ADR-0040, and ADR-0041',
          )
          replace(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              '''the complete source optimizer is implemented in version 0.39.0. This release
          implements strict project ingestion and immutable baselines, normalized
          analysis/hotspot evidence, canonical transformation recipes, the initial AST-
          aware C transformation catalogue, deterministic isolated candidate
          materialization, and candidate build/correctness assurance. Assurance consumes
          exact results from a caller-supplied isolated execution provider; portable OS
          sandbox implementation remains provider responsibility. Performance fitness
          and every later roadmap boundary remain a 1.0 target until their issues land.''',
              '''the complete source optimizer is implemented in version 0.40.0. This release
          implements strict project ingestion and immutable baselines, normalized
          analysis/hotspot evidence, canonical transformation recipes, the initial AST-
          aware C transformation catalogue, deterministic isolated candidate
          materialization, candidate build/correctness assurance, and reproducible
          baseline-versus-candidate performance measurement with finite fitness mapping.
          Assurance and measurement consume exact results from caller-supplied providers;
          portable OS sandboxing and target workload execution remain provider
          responsibilities. Whole-run recipe evolution/orchestration and every later
          roadmap boundary remain a 1.0 target until their issues land.''',
          )
          replace(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              '''ADR-0040 and EVO-HRA-012 retain this issue-specific assessment.

          ## Optimization Manifest''',
              '''ADR-0040 and EVO-HRA-012 retain this issue-specific assessment.

          The implemented 0.40.0 candidate measurement boundary also introduces no
          accelerator. Direct bounded workload/sample arrays and exact provider outcomes
          remain authority. Warmups and excluded or incomplete samples remain present in
          canonical order; deterministic aggregates, stability classification,
          comparison, and finite fitness derive from that record only. Correctness
          authority remains the candidate-assurance result, and no timing outcome can
          rewrite it. ADR-0041 and EVO-HRA-013 retain this issue-specific assessment.

          ## Optimization Manifest''',
          )

          # Finalize issue-specific governance records.
          replace(
              'docs/adr/ADR-0041-reproducible-candidate-performance-fitness.md',
              'Status: Proposed',
              'Status: Accepted',
          )
          replace(
              'docs/engineering/reports/EVO-HRA-013-candidate-performance-fitness-audit.md',
              'Audited design: EVO 0.40.0 candidate measurement and fitness boundary',
              'Audited implementation: EVO 0.40.0 candidate measurement and fitness boundary',
          )
          PY
      - name: Commit synchronized documentation
        run: |
          git config user.name "Donovan Worrell"
          git config user.email "donovan.worrell@just-a-geek.com"
          git rm .github/workflows/measurement-doc-sync.yml
          git add README.md docs/roadmap.md docs/architecture.md docs/algorithms.md repo.yaml docs/specs/EVO-001-library-contract.md docs/specs/EVO-002-source-optimizer-contract.md docs/adr/ADR-0041-reproducible-candidate-performance-fitness.md docs/engineering/reports/EVO-HRA-013-candidate-performance-fitness-audit.md
          git commit -m "docs: synchronize EVO 0.40 measurement boundary"
          git push origin HEAD:agent/reproducible-candidate-fitness
