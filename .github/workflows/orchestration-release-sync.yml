name: Orchestration Release Sync
# Retry after correcting the wrapped EVO-002 HRA marker.

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-release-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Synchronize 0.42.0 package and documentation
        run: python3 .github/scripts/orchestration_release_sync.py
      - name: Validate synchronized boundary
        run: |
          grep -F 'project(catalyst_evo VERSION 0.42.0 LANGUAGES C)' CMakeLists.txt
          grep -F '[0.42.0],' configure.ac
          grep -F '#define EVO_VERSION_MINOR 42' include/catalyst/evo/evo.h
          grep -F 'EVO 0.42.0' README.md
          grep -F 'Issue #66 implements bounded external-process orchestration' docs/roadmap.md
          grep -F 'Status: Implemented through the 0.42.0 bounded source-orchestration boundary' docs/specs/EVO-002-source-optimizer-contract.md
          grep -F 'bounded-source-orchestration-implemented-0.42.0' repo.yaml
          python3 tests/validate_project_orchestration.py
      - name: Commit non-workflow synchronization
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add \
            CMakeLists.txt \
            configure.ac \
            include/catalyst/evo/evo.h \
            README.md \
            docs/roadmap.md \
            docs/algorithms.md \
            docs/architecture.md \
            docs/specs/EVO-001-library-contract.md \
            docs/specs/EVO-002-source-optimizer-contract.md \
            repo.yaml \
            tests/validate_project_orchestration.py
          git commit -m 'docs: synchronize EVO 0.42.0 orchestration boundary'
          git push origin HEAD:agent/bounded-source-orchestration
      - name: Verify package frontends
        run: |
          cmake -S . -B build-release -DCMAKE_C_COMPILER=clang
          cmake --build build-release --target catalyst_evo catalyst_evo_project_foundation --parallel 2
          autoreconf -fi
          ./configure CC=gcc
