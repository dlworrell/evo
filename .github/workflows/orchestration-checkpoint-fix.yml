name: Fix Orchestration Checkpoint Header

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-checkpoint-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Correct fixed checkpoint envelope size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/project_orchestration_checkpoint.c')
          text = path.read_text()
          text = text.replace('size_t size = 72U;', 'size_t size = 80U;', 1)
          text = text.replace('if (size < 72U ||', 'if (size < 80U ||', 1)
          text = text.replace('if (serialized_size < 72U ||', 'if (serialized_size < 80U ||', 1)
          path.write_text(text)
          PY
          clang-format -i src/project_orchestration_checkpoint.c
      - name: Commit correction
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add src/project_orchestration_checkpoint.c
          git commit -m 'fix: correct product checkpoint envelope sizing'
          git push origin HEAD:agent/bounded-source-orchestration
