name: Project Zero

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      repository_state:
        required: true
        type: string
      profile:
        required: true
        type: string
      mutation_policy:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: Project Zero operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - plan
          - remediate
          - verify
          - certify
      repository_state:
        description: Repository state
        required: true
        default: existing
        type: choice
        options:
          - existing
          - new
      profile:
        description: Profile JSON path in this repository
        required: true
        default: .aems/project-zero/profiles/default/profile.json
        type: string
      mutation_policy:
        description: Permitted workflow mutation
        required: true
        default: report-only
        type: choice
        options:
          - report-only
          - create-issues
          - open-remediation-pr

concurrency:
  group: project-zero-${{ github.repository }}
  cancel-in-progress: false

jobs:
  project-zero:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Project Zero engine
        id: p0
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python3 tools/project_zero.py \
            "${{ inputs.mode }}" \
            --repository-state "${{ inputs.repository_state }}" \
            --profile "${{ inputs.profile }}" \
            --output build/project-zero-report \
            | tee build/project-zero-console.log
          status=${PIPESTATUS[0]}
          echo "engine_status=${status}" >> "$GITHUB_OUTPUT"

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/project-zero-report/executive-summary.md ]]; then
            cat build/project-zero-report/executive-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Project Zero\n\nThe engine failed before producing its report.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-zero-report-${{ github.run_id }}
          path: |
            build/project-zero-report/
            build/project-zero-console.log
          if-no-files-found: warn
          retention-days: 90

      - name: Create remediation issue
        if: inputs.mutation_policy == 'create-issues' && hashFiles('build/project-zero-report/findings.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count=$(python3 -c 'import json; print(len(json.load(open("build/project-zero-report/findings.json"))))')
          if [[ "$count" -gt 0 ]]; then
            gh issue create \
              --title "Project Zero remediation required ($count findings)" \
              --body-file build/project-zero-report/executive-summary.md
          fi

      # AES-DEV-001-R005: remediation commits are created through the GraphQL
      # createCommitOnBranch API with GITHUB_TOKEN, so GitHub signs them and they
      # are "Verified". No local git commit/push is performed, and the commit
      # always lands on a p0/remediation-* branch, never the default branch.
      - name: Create verified remediation commit
        id: remediation_commit
        if: >-
          inputs.mode == 'remediate'
          && inputs.mutation_policy == 'open-remediation-pr'
          && github.event_name != 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          branch="p0/remediation-${GITHUB_RUN_ID}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          python3 tools/project_zero_commit.py \
            --branch "$branch" \
            --base "$BASE_BRANCH" \
            --message "fix(p0): apply safe repository baseline remediation" \
            SECURITY.md CONTRIBUTING.md GOVERNANCE.md repo.yaml p0.yaml .github/pull_request_template.md

      - name: Report no-op remediation
        if: steps.remediation_commit.outputs.committed == 'false'
        shell: bash
        run: echo "No safe remediation changes were generated." >> "$GITHUB_STEP_SUMMARY"

      - name: Open remediation pull request
        if: steps.remediation_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ steps.remediation_commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "Project Zero baseline remediation" \
            --body-file build/project-zero-report/executive-summary.md

      - name: Enforce verification or certification result
        if: always() && (inputs.mode == 'verify' || inputs.mode == 'certify')
        shell: bash
        run: test "${{ steps.p0.outputs.engine_status }}" = "0"
