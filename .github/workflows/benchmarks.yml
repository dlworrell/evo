name: Core Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Benchmark evidence tier
        required: true
        default: extended
        type: choice
        options:
          - smoke
          - extended

permissions:
  contents: read

jobs:
  core-benchmark:
    runs-on: ubuntu-24.04
    env:
      BENCHMARK_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'smoke' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure release benchmark
        run: >-
          cmake -S . -B build/benchmark
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DEVO_BENCHMARK_COMMIT=${GITHUB_SHA}

      - name: Build and validate benchmark evidence
        run: cmake --build build/benchmark --target "benchmark-${BENCHMARK_TIER}" --parallel

      - name: Publish benchmark summary
        shell: bash
        run: |
          summary="build/benchmark/benchmark-results/EVO-CORE-001-${BENCHMARK_TIER}.md"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evo-core-benchmark-${{ env.BENCHMARK_TIER }}-${{ github.run_id }}
          path: build/benchmark/benchmark-results/
          retention-days: 90
