name: Issue 67 Distcheck Fix

on:
  push:
    branches:
      - agent/issue-67-product-commands

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-67-product-commands
          fetch-depth: 0
      - name: Remove future provider ADR from v0.43 distribution inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Makefile.am')
          text = path.read_text(encoding='utf-8')
          old = '\tdocs/adr/ADR-0044-built-in-production-providers.md \\\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one future ADR-0044 dist entry, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          autoreconf -fi
          mkdir -p build/distcheck-issue67
          cd build/distcheck-issue67
          ../../configure CC=gcc >/dev/null
          make distcheck
      - name: Remove one-shot workflow
        run: rm .github/workflows/issue-67-distcheck-fix.yml
      - name: Commit corrected distribution inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile.am
          git add -u .github/workflows/issue-67-distcheck-fix.yml
          git diff --cached --check
          git commit -m 'Correct product command distribution inventory'
          git push origin HEAD:agent/issue-67-product-commands
