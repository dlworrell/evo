name: Measurement Cleanup

on:
  push:
    branches:
      - agent/reproducible-candidate-fitness
    paths:
      - '.github/workflows/measurement-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reproducible-candidate-fitness
      - name: Remove new dangerous-primitive findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing cleanup anchor in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/project_measurement_model.c',
              '''char *evo_measurement_duplicate(const char *value)
          {
              size_t size;
              char *copy;

              if (value == NULL) {
                  return NULL;
              }
              size = strlen(value) + 1U;
              copy = evo_project_allocate_zeroed(size, sizeof(*copy));
              if (copy != NULL) {
                  (void)memcpy(copy, value, size);
              }
              return copy;
          }''',
              '''char *evo_measurement_duplicate(const char *value)
          {
              size_t size;
              size_t index;
              char *copy;

              if (value == NULL) {
                  return NULL;
              }
              size = strlen(value) + 1U;
              copy = evo_project_allocate_zeroed(size, sizeof(*copy));
              if (copy != NULL) {
                  for (index = 0U; index < size; index += 1U) {
                      copy[index] = value[index];
                  }
              }
              return copy;
          }''',
          )

          replace(
              'tests/project_measurement_test.c',
              '#include "internal/project_candidate_internal.h"\n#include "internal/project_measurement.h"',
              '#include "internal/project_candidate_internal.h"\n#include "internal/project_measurement.h"\n#include "internal/project_runtime.h"',
          )
          replace(
              'tests/project_measurement_test.c',
              '    (void)memset(assurance, 0, sizeof(*assurance));',
              '    *assurance = (evo_project_assurance_t){0};',
          )
          replace(
              'tests/project_measurement_test.c',
              '    (void)memset(&policy, 0, sizeof(policy));',
              '    policy = (evo_project_measurement_workload_policy_t){0};',
          )
          replace(
              'tests/project_measurement_test.c',
              '    (void)memset(&config, 0, sizeof(config));',
              '    config = (evo_project_measurement_config_t){0};',
          )
          replace(
              'tests/project_measurement_test.c',
              '''    (void)snprintf(
                  assurance->assurance_fingerprint,
                  sizeof(assurance->assurance_fingerprint),
                  "%s",
                  "fnv1a64:2222222222222222");''',
              '''    CHECK_FORMAT(evo_project_format(
                  assurance->assurance_fingerprint,
                  sizeof(assurance->assurance_fingerprint),
                  "%s",
                  "fnv1a64:2222222222222222"),
              sizeof(assurance->assurance_fingerprint));''',
          )
          replace(
              'tests/project_measurement_test.c',
              '''    const int written = snprintf(output, sizeof(output), "%s/%s", root, name);''',
              '''    const int written =
                  evo_project_format(output, sizeof(output), "%s/%s", root, name);''',
          )
          replace(
              'tests/project_measurement_test.c',
              '''        (void)snprintf(
                  fingerprint,
                  EVO_PROJECT_FINGERPRINT_TEXT_SIZE,
                  "%s",
                  measurement.measurement_fingerprint);''',
              '''        const int fingerprint_written = evo_project_format(
                  fingerprint,
                  EVO_PROJECT_FINGERPRINT_TEXT_SIZE,
                  "%s",
                  measurement.measurement_fingerprint);
              CHECK(fingerprint_written > 0 &&
                    (size_t)fingerprint_written < EVO_PROJECT_FINGERPRINT_TEXT_SIZE);''',
          )
          replace(
              'tests/project_measurement_test.c',
              '''    (void)snprintf(
                  invalid_output, sizeof(invalid_output), "%s/ineligible", root);''',
              '''    CHECK(evo_project_format(
                      invalid_output, sizeof(invalid_output), "%s/ineligible", root) > 0);''',
          )
          PY
      - name: Define checked format helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/project_measurement_test.c')
          text = p.read_text()
          anchor = '#define CHECK(condition)'
          idx = text.find(anchor)
          if idx < 0:
              raise SystemExit('CHECK macro anchor missing')
          insert_at = text.find('\n\n', idx)
          if insert_at < 0:
              raise SystemExit('CHECK macro terminator missing')
          helper = '''\n#define CHECK_FORMAT(result, capacity)                                         \\
              do {                                                                       \\
                  const int check_format_result = (result);                                \\
                  CHECK(check_format_result > 0 &&                                         \\
                        (size_t)check_format_result < (capacity));                         \\
              } while (0)'''
          p.write_text(text[:insert_at] + helper + text[insert_at:])
          PY
      - name: Canonicalize C formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format -i \
            src/internal/project_measurement.h \
            src/internal/project_measurement_internal.h \
            src/internal/project_measurement_owner.h \
            src/project_measurement.c \
            src/project_measurement_model.c \
            src/project_measurement_runtime.c \
            tests/project_measurement_test.c
      - name: Commit cleanup
        run: |
          git config user.name "Donovan Worrell"
          git config user.email "donovan.worrell@just-a-geek.com"
          git rm .github/workflows/measurement-cleanup.yml
          git add src/internal/project_measurement.h src/internal/project_measurement_internal.h src/internal/project_measurement_owner.h src/project_measurement.c src/project_measurement_model.c src/project_measurement_runtime.c tests/project_measurement_test.c
          git commit -m "fix: clear measurement security ratchet and formatting"
          git push origin HEAD:agent/reproducible-candidate-fitness
