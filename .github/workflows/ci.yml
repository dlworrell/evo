name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
          - os: ubuntu-latest
            compiler: clang
            cc: clang
          - os: macos-latest
            compiler: clang
            cc: clang

    env:
      CC: ${{ matrix.cc }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  product-command-contract:
    name: product command contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate command schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("docs/schemas").glob("evo-command-*-v1.schema.json"))
          if len(paths) != 4:
              raise SystemExit(f"expected four command schemas, found {len(paths)}")
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  document = json.load(handle)
              if document.get("$schema") != "https://json-schema.org/draft/2020-12/schema":
                  raise SystemExit(f"unexpected JSON Schema dialect: {path}")
          PY

      - name: CMake command contract
        run: |
          cmake -S . -B build-command -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build-command --target evo_project_command_test --parallel
          ctest --test-dir build-command --output-on-failure -R '^evo_project_command_test$'

      - name: Autotools command contract
        run: |
          autoreconf -fi
          mkdir build-autotools-command
          cd build-autotools-command
          ../configure
          make -j2 tests/evo_project_command_test
          ./tests/evo_project_command_test

  release-readiness-unit:
    name: release readiness authority semantics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test release readiness aggregation
        run: python3 -m unittest tests/test_release_readiness.py
