name: Issue 67 AES-BLD Inventory Sync

on:
  push:
    branches:
      - agent/issue-67-product-commands

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-67-product-commands
          fetch-depth: 0
      - name: Add product command source and test to AES-BLD authority
        run: |
          python3 -c 'import json,pathlib; p=pathlib.Path(".aems/aes-bld-001.json"); d=json.loads(p.read_text()); s=d["build"]["production_sources"]; t=d["build"]["normative_tests"]; assert "src/project_command.c" not in s; s.append("src/project_command.c"); assert not any(x["id"]=="project-command" for x in t); t.append({"id":"project-command","source":"tests/project_command_test.c","cmake":"evo_project_command_test","autotools":"tests/evo_project_command_test"}); p.write_text(json.dumps(d, indent=2)+"\n")'
          python3 -m json.tool .aems/aes-bld-001.json >/dev/null
          grep -F '"src/project_command.c"' .aems/aes-bld-001.json
          grep -F '"source": "tests/project_command_test.c"' .aems/aes-bld-001.json
      - name: Remove one-shot workflow
        run: rm .github/workflows/issue-67-aes-bld-inventory-sync.yml
      - name: Commit synchronized inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add product command to AES-BLD inventory'
          git push origin HEAD:agent/issue-67-product-commands
