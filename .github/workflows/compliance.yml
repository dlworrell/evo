name: Repository Compliance

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'README.md'
      - 'LICENSE*'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'aes-manifest.yaml'
      - 'repo.yaml'
      - 'p0.yaml'
      - '.aems/**'
      - 'docs/engineering/reports/EVO-P0-*.md'
      - '.github/workflows/compliance.yml'

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate retained oversight records
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            SECURITY.md
            CONTRIBUTING.md
            GOVERNANCE.md
            aes-manifest.yaml
            repo.yaml
            p0.yaml
            docs/engineering/reports/EVO-P0-002-engineering-ready-certification.md
          )
          for path in "${required[@]}"; do
            test -s "$path"
          done
          grep -Eq '^[[:space:]]*state:[[:space:]]*ENGINEERING_READY[[:space:]]*$' aes-manifest.yaml
          grep -Eq '^[[:space:]]*status:[[:space:]]*approved[[:space:]]*$' aes-manifest.yaml
          grep -Fq 'EVO-P0-002-engineering-ready-certification.md' aes-manifest.yaml
          python3 -m json.tool .aems/aes-bld-001.json >/dev/null
          python3 -m json.tool docs/engineering/AES-SEC-001-review-dispositions.json >/dev/null
          mkdir -p build/compliance-report
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("build/compliance-report")
          evidence = {
              "schema": "catalyst.repository-compliance.v1",
              "repository": os.environ.get("GITHUB_REPOSITORY", "local"),
              "commit": os.environ.get("GITHUB_SHA", "local"),
              "oversight_state": "ENGINEERING_READY",
              "certification_record": "EVO-P0-002",
              "project_zero_rerun": False,
              "result": "passed",
          }
          (output / "compliance.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          (output / "executive-summary.md").write_text(
              "# Repository Compliance\n\n"
              "Retained oversight certification: **present**\n\n"
              "Current governance manifests and machine-readable ledgers: **valid**\n\n"
              "Project Zero was not rerun.\n",
              encoding="utf-8",
          )
          PY
      - name: Publish compliance summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/compliance-report/executive-summary.md ]]; then
            cat build/compliance-report/executive-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compliance-report-${{ github.run_id }}
          path: |
            build/compliance-report/
          if-no-files-found: warn
          retention-days: 90
