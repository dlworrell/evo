name: Fix Trace Assertion

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/fix-trace-assertion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Patch assertion
        run: |
          perl -0pi -e 's/serial_trace\.job_count ==\n                serial_trace\.batch_count \* serial_config\.population_size,/serial_trace.job_count > 0U \&\&\n            serial_trace.job_count <=\n                serial_trace.batch_count * serial_config.population_size,/' tests/project_search_test.c
          perl -0pi -e 's/persistent worker traces retain every generation/persistent worker traces retain every dispatched generation and job/' tests/project_search_test.c
          clang-format -i tests/project_search_test.c
          grep -F 'persistent worker traces retain every dispatched generation and job' tests/project_search_test.c
      - name: Commit patch
        run: |
          rm -f .github/workflows/fix-trace-assertion.yml
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A tests/project_search_test.c .github/workflows/fix-trace-assertion.yml
          git commit -m 'test: bound persistent trace to dispatched candidates'
          git push origin HEAD:agent/bounded-source-orchestration
