name: Issue 67 Version Sync

on:
  push:
    branches:
      - agent/issue-67-product-commands

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-67-product-commands
          fetch-depth: 0

      - name: Synchronize EVO 0.43.0 package authorities
        run: python3 scripts/issue67_version_sync.py

      - name: Remove one-shot synchronization helpers
        run: |
          rm .github/workflows/issue-67-version-sync.yml
          rm scripts/issue67_version_sync.py

      - name: Commit synchronized package authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Synchronize EVO 0.43 package authorities'
          git push origin HEAD:agent/issue-67-product-commands
