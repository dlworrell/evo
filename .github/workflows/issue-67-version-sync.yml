name: Issue 67 Package Authority Sync

on:
  push:
    branches:
      - agent/issue-67-product-commands
    paths:
      - scripts/sync_043_package_authorities.py
      - .github/workflows/issue-67-version-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: agent/issue-67-product-commands
          fetch-depth: 0

      - name: Apply guarded release-forward edits
        run: python3 scripts/sync_043_package_authorities.py

      - name: Commit synchronized authorities
        run: |
          if git diff --quiet; then
            echo 'No package-authority changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/architecture.md docs/algorithms.md \
            docs/specs/EVO-001-library-contract.md \
            docs/specs/EVO-002-source-optimizer-contract.md
          git commit -m 'Synchronize EVO 0.43 package authorities [version-sync]'
          git push origin HEAD:agent/issue-67-product-commands
