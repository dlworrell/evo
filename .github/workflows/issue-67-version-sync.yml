name: Issue 67 Version Sync

on:
  push:
    branches:
      - agent/issue-67-product-commands

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-67-product-commands
          fetch-depth: 0

      - name: Synchronize EVO 0.43.0 package authorities
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              write(path, text.replace(old, new, expected))

          def replace_section(path, start, end, replacement):
              text = read(path)
              if text.count(start) != 1:
                  raise SystemExit(f'{path}: start marker is not unique: {start!r}')
              start_index = text.index(start)
              end_index = text.index(end, start_index + len(start))
              write(path, text[:start_index] + replacement + text[end_index:])

          # README package authority and product boundary.
          replace_exact(
              'README.md',
              '- `docs/adr/ADR-0043-bounded-parallel-source-orchestration.md`\n- `docs/specs/EVO-001-library-contract.md`\n- `docs/specs/EVO-002-source-optimizer-contract.md`',
              '- `docs/adr/ADR-0043-bounded-parallel-source-orchestration.md`\n- `docs/adr/ADR-0045-product-command-contract.md`\n- `docs/specs/EVO-001-library-contract.md`\n- `docs/specs/EVO-002-source-optimizer-contract.md`\n- `docs/specs/EVO-002A-product-command-provider-authority.md`\n- `docs/specs/EVO-003-product-command-contract.md`'
          )
          replace_exact(
              'README.md',
              'EVO-HRA-015 retains this orchestration-specific audit.\n\n## Roadmap Scope',
              'EVO-HRA-015 retains this orchestration-specific audit.\nADR-0045 assesses the 0.43.0 product command contract: fixed ordered command\nand provider-requirement registries plus direct validation are exact authority;\nno cache, generated dispatcher, compressed lookup, or probabilistic precheck\nparticipates. EVO-003 is the complete executable-facing audit projection and\nEVO-HRA-016 retains this command-specific assessment.\n\n## Roadmap Scope'
          )
          replace_exact(
              'README.md',
              '- Implemented bounded external-process orchestration with stable result-commit\n  order, persistent worker traces, resource/capability policy, product\n  checkpoint identity, and deterministic resume\n- Reviewable optimized patches and machine-readable evidence bundles',
              '- Implemented bounded external-process orchestration with stable result-commit\n  order, persistent worker traces, resource/capability policy, product\n  checkpoint identity, and deterministic resume\n- Implemented versioned `analyze`, `evolve`, `replay`, and `report` command\n  contract with stable production-provider identity/capability selection,\n  replay/checkpoint binding, fail-closed admission, and read-only input policy\n- Reviewable optimized patches and machine-readable evidence bundles'
          )
          replace_exact(
              'README.md',
              'Version 0.42.0 adds bounded external-process source orchestration, deterministic\ncandidate/workspace/logical-worker assignment, stable result commit independent\nof completion order, persistent exact worker traces, fail-closed cleanup, and\nproduct checkpoint identity with uninterrupted-versus-resumed differential\nevidence. The installed executable remains dependency-ordered roadmap work.',
              'Version 0.42.0 adds bounded external-process source orchestration, deterministic\ncandidate/workspace/logical-worker assignment, stable result commit independent\nof completion order, persistent exact worker traces, fail-closed cleanup, and\nproduct checkpoint identity with uninterrupted-versus-resumed differential\nevidence. Version 0.43.0 adds the executable-facing product command contract:\nversioned analyze/evolve/replay/report schemas, stable exit classes, explicit\npath and stream roles, exact production-provider identity/version/capability\nadmission, and replay/checkpoint binding before external execution. The\ninstalled executable remains dependency-ordered roadmap work after #114.'
          )
          replace_exact(
              'README.md',
              'installed-core sources, 35 private source-foundation sources, and 44\nnormative tests.',
              'installed-core sources, 36 private source-foundation sources, and 45\nnormative tests.'
          )
          replace_section(
              'README.md',
              '## Status\n\n',
              'EVO 0.16.0 composes',
              '''## Status

**Current implementation boundary:** EVO 0.43.0 packages the deterministic
evolutionary-search core plus the private source-optimizer foundations for
strict C-project ingestion, immutable baselines, normalized Clang/LLVM
analysis, canonical transformation recipes, three AST-aware C
transformations, isolated candidate materialization, candidate assurance,
reproducible candidate performance measurement, structured recipe search,
bounded external-process source orchestration, and the executable-facing
product command contract.

The command layer exposes the versioned `analyze`, `evolve`, `replay`, and
`report` contract as deterministic execution plans. It binds stable production
provider identities, implementation versions, capability-policy identity,
explicit path/stream roles, checkpoint/replay requirements, and fail-closed
security/output invariants before external execution may be authorized. The
planner itself launches no target process and never mutates the input
repository. Concrete production-provider implementations remain #114 and the
installed standalone executable remains #93; optimized artifact publication
(#68), end-to-end proof (#69), and final stabilization (#56) follow those
dependency-ordered boundaries.

'''
          )

          # Architecture current package and command boundary.
          replace_exact(
              'docs/architecture.md',
              'before resume.\n\nSource genomes never',
              'before resume.\nVersion 0.43.0 adds the executable-facing product command contract as a fixed\nordered registry plus deterministic execution-plan validation. The command\nlayer binds explicit path roles, checkpoint/replay semantics, stable exit\nclasses, and the exact production provider identity/version/capability policy\nthat #114 must satisfy before #93 may execute target-project work. It launches\nno target process itself and preserves the immutable input boundary.\n\nSource genomes never'
          )
          replace_section(
              'docs/architecture.md',
              '## Current Conformance Boundary\n\n',
              'The 0.37.0 package\'s core',
              '''## Current Conformance Boundary

Version 0.43.0 contains the evolutionary-search core, its bounded reference
consumers, private project ingestion, normalized analysis and hotspot model,
canonical transformation recipes, the initial AST-aware C transformation
catalogue, isolated candidate materialization, candidate assurance,
reproducible candidate measurement with finite fitness mapping, deterministic
structured recipe search, bounded external-process source orchestration, and
the executable-facing product command contract.

The 0.43 command layer is declarative authority: it validates the complete
operation request and the exact production-provider selection required for
external execution, but does not itself provide a sandbox or run target code.
The concrete providers remain issue #114 and the installed standalone
application remains issue #93. Product patch/evidence artifacts remain #68.

'''
          )
          replace_exact(
              'docs/architecture.md',
              'EVO-HRA-015 audits this 0.42.0 boundary. The current implementation\ntherefore has no opaque accelerated authority requiring remediation.',
              'EVO-HRA-015 audits this 0.42.0 boundary. The 0.43.0 command registry\nand provider requirement registry are fixed ordered arrays with direct scans;\nEVO-HRA-016 audits that command boundary and confirms that no accelerated or\nprobabilistic authority participates. The current implementation therefore has\nno opaque accelerated authority requiring remediation.'
          )

          # Algorithms package introduction.
          replace_section(
              'docs/algorithms.md',
              'This document distinguishes algorithms implemented by the reusable\n',
              '## EVO Core Initial Release',
              '''This document distinguishes algorithms implemented by the reusable
`catalyst_evo` core from the structured program transformations and evaluation
algorithm required by the EVO 1.0 source optimizer. Version 0.43.0 implements
the core plus project ingestion, immutable-baseline preparation, normalized
Clang/LLVM analysis and hotspot ranking, canonical transformation recipes,
three AST-aware source-transformation applications, deterministic isolated
candidate materialization, exact candidate build/correctness assurance,
reproducible baseline-versus-candidate performance measurement, structured
recipe evolution, bounded external-process source orchestration, and the
versioned `analyze`, `evolve`, `replay`, and `report` product command contract.

The search algorithm initializes canonical recipes from live
opportunities/catalogue authority, mutates only whole records or typed
parameters, crosses whole records rather than source bytes, applies only
versioned bounded deterministic repair, rejects invalid recipes before
materialization, and records every operator event plus complete downstream
recipe → candidate → assurance → measurement → fitness lineage. Fixed seeds
replay population/search identity; strict improvements replace the winner and
exact ties retain the earlier stable candidate. External evaluation batches
may finish out of order, but stable candidate-order commit, exact worker traces,
fail-closed cleanup, and product checkpoint identity keep logical search and
resume deterministic.

The 0.43 command planner adds no search heuristic. It deterministically maps a
validated request to an execution plan, provider requirements, path/stream
roles, checkpoint/replay policy, and stable exit semantics. Concrete production
provider execution is #114 and installed CLI dispatch is #93.

'''
          )

          # EVO-001 remains the same installed-core contract while package metadata advances.
          replace_exact('docs/specs/EVO-001-library-contract.md', 'Version: 0.42.0', 'Version: 0.43.0')
          replace_section(
              'docs/specs/EVO-001-library-contract.md',
              '## Scope Boundary\n\n',
              '## Purpose',
              '''## Scope Boundary

This specification governs the reusable deterministic C17 evolutionary-search
core packaged through version 0.43.0. Version 0.43.0 changes no installed core
semantics; its new implementation is confined to the private source-optimizer
product-command contract. The installed core compatibility header remains
0.37.0. This contract does not define C-project ingestion, Clang/LLVM analysis,
structured source transformations, isolated candidate builds,
baseline-versus-candidate measurement, optimized patches, or product-level
replay artifacts.

Those source-to-source product responsibilities are defined separately by
`EVO-002-source-optimizer-contract.md`, its product-provider addendum EVO-002A,
and the executable-facing EVO-003 command contract. An EVO-001 conforming run
or compiler-option adapter alone must not be described as an optimized C
codebase.

'''
          )

          # EVO-002 advances and explicitly delegates executable-facing provider authority.
          replace_exact(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              'Status: Implemented through the 0.42.0 bounded source-orchestration boundary; draft 1.0 target',
              'Status: Implemented through the 0.43.0 product-command contract boundary; draft 1.0 target'
          )
          replace_exact('docs/specs/EVO-002-source-optimizer-contract.md', 'Version: 0.42.0', 'Version: 0.43.0')
          replace_exact(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              'Governing ADRs: ADR-0016, ADR-0026, ADR-0035, ADR-0036, ADR-0037, ADR-0038, ADR-0039, ADR-0040, ADR-0041, ADR-0042, and ADR-0043',
              'Governing ADRs: ADR-0016, ADR-0026, ADR-0035, ADR-0036, ADR-0037, ADR-0038, ADR-0039, ADR-0040, ADR-0041, ADR-0042, ADR-0043, and ADR-0045\nCommand/provider addendum: `EVO-002A-product-command-provider-authority.md`\nExecutable-facing command contract: `EVO-003-product-command-contract.md`'
          )
          replace_section(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              '## Purpose\n\n',
              '## Claim Boundary',
              '''## Purpose

EVO ingests a buildable C codebase and a declared optimization contract,
analyzes its source and measured behavior, evolves structured source-level
alternatives, compiles and validates isolated candidates, and emits the
highest-ranked fully verified C source candidate found within the bounded
search as a reviewable patch and reproducibility package.

This specification defines the product layer above the reusable C17
evolutionary-search core governed by EVO-001. The complete installed source
optimizer is not yet delivered in version 0.43.0. The implemented private
foundation includes strict project ingestion and immutable baselines,
normalized analysis/hotspot evidence, canonical transformation recipes, the
initial AST-aware C transformation catalogue, deterministic isolated candidate
materialization, candidate build/correctness assurance, reproducible
baseline-versus-candidate measurement with finite fitness mapping,
deterministic structured recipe evolution through the reusable EVO core, and
bounded external-process source orchestration with stable result commit,
cleanup evidence, persistent worker traces, and product checkpoint/resume
authority.

Version 0.43.0 additionally defines the executable-facing `analyze`, `evolve`,
`replay`, and `report` contract. EVO-002A and EVO-003 supersede the older
caller-supplied callback wording for the standalone product path: commands must
select stable production provider identities, implementation versions, and the
required capability-policy identity; unavailable or incompatible required
providers fail before external candidate execution and may not fall back to a
private callback or weaker unsandboxed path. The 0.34–0.42 callback seams
remain internal test/embedding mechanisms.

Concrete production provider implementations remain issue #114 and the
installed standalone executable remains issue #93. Artifact publication (#68),
end-to-end source proof (#69), and later release boundaries remain 1.0 work.

'''
          )

          # Release-forward historical orchestration validator.
          replace_exact(
              'tests/validate_project_orchestration.py',
              '    require(version_tuple == (0, 42, 0), "package version is not EVO 0.42.0")',
              '    require(version_tuple >= (0, 42, 0), "package predates orchestration boundary")'
          )

          # AES-BLD source/test inventory must include the new private command module.
          replace_exact(
              '.aems/aes-bld-001.json',
              '      "src/project_orchestration.c",\n      "src/project_orchestration_checkpoint.c"\n    ],',
              '      "src/project_orchestration.c",\n      "src/project_orchestration_checkpoint.c",\n      "src/project_command.c"\n    ],'
          )
          replace_exact(
              '.aems/aes-bld-001.json',
              '      {\n        "id": "project-orchestration-resume",\n        "source": "tests/project_orchestration_resume_test.c",\n        "cmake": "evo_project_orchestration_resume_test",\n        "autotools": "tests/evo_project_orchestration_resume_test"\n      }\n    ],',
              '      {\n        "id": "project-orchestration-resume",\n        "source": "tests/project_orchestration_resume_test.c",\n        "cmake": "evo_project_orchestration_resume_test",\n        "autotools": "tests/evo_project_orchestration_resume_test"\n      },\n      {\n        "id": "project-command",\n        "source": "tests/project_command_test.c",\n        "cmake": "evo_project_command_test",\n        "autotools": "tests/evo_project_command_test"\n      }\n    ],'
          )

          # The branch metadata was already advanced earlier; assert it remains exact.
          repo = read('repo.yaml')
          required_repo_markers = (
              'status: implemented-core-0.37.0',
              'status: product-command-contract-implemented-0.43.0',
              'contract: docs/specs/EVO-003-product-command-contract.md',
          )
          for marker in required_repo_markers:
              if marker not in repo:
                  raise SystemExit(f'repo.yaml: missing expected marker: {marker}')
          PY

      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/issue-67-version-sync.yml

      - name: Commit synchronized package authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/architecture.md docs/algorithms.md \
            docs/specs/EVO-001-library-contract.md \
            docs/specs/EVO-002-source-optimizer-contract.md \
            tests/validate_project_orchestration.py \
            .aems/aes-bld-001.json \
            .github/workflows/issue-67-version-sync.yml
          git diff --cached --check
          git commit -m 'Synchronize EVO 0.43 package authorities'
          git push origin HEAD:agent/issue-67-product-commands
