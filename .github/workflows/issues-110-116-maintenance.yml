name: Issues 110 and 116 maintenance

on:
  push:
    branches:
      - agent/issues-110-116-audit-maintenance
    paths:
      - '.github/scripts/issues-110-116-maintenance.py'
      - '.github/workflows/issues-110-116-maintenance.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/issues-110-116-maintenance.py'
      - '.github/workflows/issues-110-116-maintenance.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/issues-110-116-audit-maintenance' || github.ref_name == 'agent/issues-110-116-audit-maintenance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issues-110-116-audit-maintenance
      - name: Repair reconciler self-check and verifier scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/issues-110-116-maintenance.py')
          text = path.read_text(encoding='utf-8')

          old = '''    namespace = {"__name__": "__main__"}\n    exec((ROOT / "scripts/verify_aes_bld_profile.py").read_text(encoding="utf-8"), namespace)\n    exec((ROOT / "scripts/verify_github_actions_runtime.py").read_text(encoding="utf-8"), {"__name__": "__main__"})\n'''
          new = '''    runpy.run_path(str(ROOT / "scripts/verify_aes_bld_profile.py"), run_name="__main__")\n    runpy.run_path(str(ROOT / "scripts/verify_github_actions_runtime.py"), run_name="__main__")\n'''
          if old not in text:
              raise SystemExit('expected self-check block not found')
          text = text.replace(old, new)

          old = 'TEST_CMAKE = ROOT / "tests/CMakeLists.txt"\nREADINESS = ROOT / "scripts/release_readiness.py"'
          new = 'TEST_CMAKE = ROOT / "tests/CMakeLists.txt"\nBENCH_CMAKE = ROOT / "benchmarks/CMakeLists.txt"\nREADINESS = ROOT / "scripts/release_readiness.py"'
          if old not in text:
              raise SystemExit('expected generated verifier path block not found')
          text = text.replace(old, new)

          old = 'test_cmake = TEST_CMAKE.read_text(encoding="utf-8")\ncore = target_sources(cmake, "catalyst_evo")'
          new = 'test_cmake = TEST_CMAKE.read_text(encoding="utf-8")\nbench_cmake = BENCH_CMAKE.read_text(encoding="utf-8")\ncore = target_sources(cmake, "catalyst_evo")'
          if old not in text:
              raise SystemExit('expected generated verifier read block not found')
          text = text.replace(old, new)

          old = 'combined_build = cmake + "\\\\n" + test_cmake + "\\\\n" + makefile'
          new = 'combined_build = cmake + "\\\\n" + test_cmake + "\\\\n" + bench_cmake + "\\\\n" + makefile'
          if old not in text:
              raise SystemExit('expected generated verifier combined-build block not found')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Reconcile audit findings
        run: python3 .github/scripts/issues-110-116-maintenance.py
      - name: Verify no deprecated action references remain
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'actions/checkout@v4' .github/workflows
          ! grep -R --line-number --fixed-strings 'actions/upload-artifact@v4' .github/workflows
      - name: Commit reconciled tree and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/issues-110-116-maintenance.py
          rm -f .github/workflows/issues-110-116-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconciliation changes produced.'
            exit 1
          fi
          git commit -m 'Resolve AES-BLD profile and Actions runtime audit findings'
          git push origin HEAD:agent/issues-110-116-audit-maintenance
