name: Issues 110 and 116 maintenance

on:
  push:
    branches:
      - agent/issues-110-116-audit-maintenance
    paths:
      - '.github/scripts/issues-110-116-maintenance.py'
      - '.github/workflows/issues-110-116-maintenance.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issues-110-116-audit-maintenance
      - name: Reconcile audit findings
        run: python3 .github/scripts/issues-110-116-maintenance.py
      - name: Verify no deprecated action references remain
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'actions/checkout@v4' .github/workflows
          ! grep -R --line-number --fixed-strings 'actions/upload-artifact@v4' .github/workflows
      - name: Commit reconciled tree and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/issues-110-116-maintenance.py
          rm -f .github/workflows/issues-110-116-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconciliation changes produced.'
            exit 1
          fi
          git commit -m 'Resolve AES-BLD profile and Actions runtime audit findings'
          git push origin HEAD:agent/issues-110-116-audit-maintenance
