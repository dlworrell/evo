name: Code Quality

on:
  push:
    branches: [main, dev-daily, fitment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Required checks cannot use paths-ignore (a check that never reports blocks
  # merging), so a changes job decides: a rea/-only change skips EVO's native
  # checks, which then report as skipped (ADR-0049).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      evo_native: ${{ steps.detect.outputs.evo_native }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci_security/changed_languages.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  formatting:
    needs: changes
    if: needs.changes.outputs.evo_native == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(find include src tests benchmarks examples -type f \( -name '*.c' -o -name '*.h' \) 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C source files found."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

  static-analysis:
    needs: changes
    if: needs.changes.outputs.evo_native == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck

      - name: Configure compile database
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON

      - name: Run cppcheck
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr -I include src tests benchmarks examples

      - name: Run clang-tidy
        shell: bash
        run: |
          mapfile -t files < <(
            find src tests benchmarks -type f -name '*.c' \
              ! -path 'tests/fixtures/*' | sort
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C source files found."
            exit 0
          fi
          clang-tidy -p build "${files[@]}"
          mapfile -t example_files < <(find examples -type f -name '*.c' | sort)
          if [ ${#example_files[@]} -ne 0 ]; then
            clang-tidy "${example_files[@]}" -- -std=c17 -Iinclude -pthread
          fi
