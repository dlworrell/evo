name: Archive Audit Research Gates

on:
  pull_request:
    paths:
      - 'tools/archive_audit/**'
      - '.github/workflows/archive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-reference:
    name: native-${{ matrix.cc }}-and-reference
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang clang-tidy valgrind libssl-dev pkg-config

      - name: Strict native build and differential/reference tests
        run: |
          python3 -m unittest discover -s tools/archive_audit -p 'test_*.py' -v

      - name: Clang-Tidy (repo AES-SEC-001 policy)
        run: |
          clang-tidy tools/archive_audit/stream_hash.c -- -std=c17

      - name: Memory leak and invalid access (Valgrind)
        run: |
          "$CC" -std=c17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            tools/archive_audit/stream_hash.c -o /tmp/archive-stream-hash \
            $(pkg-config --cflags --libs openssl)
          printf 'synthetic-archive-test\n' | valgrind \
            --leak-check=full --show-leak-kinds=all --error-exitcode=22 \
            /tmp/archive-stream-hash - 4096 > /tmp/archive-manifest.jsonl
          python3 -c 'import json; x=[json.loads(y) for y in open("/tmp/archive-manifest.jsonl")]; assert x[-1]["complete"] is True and x[-1]["chunks"] == 1'

      - name: Sanitizer boundary and streaming tests
        env:
          ARCHIVE_AUDIT_CFLAGS: -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 -m unittest discover -s tools/archive_audit -p 'test_stream_hash.py' -v
