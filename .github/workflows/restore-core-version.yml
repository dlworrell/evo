name: Restore Installed Core Version

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/restore-core-version.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Restore installed core semantic version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('include/catalyst/evo/evo.h')
          text = path.read_text()
          old = '#define EVO_VERSION_MINOR 42\n'
          new = '#define EVO_VERSION_MINOR 37\n'
          if old not in text:
              raise SystemExit('temporary 0.42 core version macro not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit core-version correction
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add include/catalyst/evo/evo.h
          git commit -m 'fix: preserve installed core version 0.37.0'
          git push origin HEAD:agent/bounded-source-orchestration
