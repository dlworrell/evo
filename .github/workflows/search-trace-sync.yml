name: Structured Search Trace Sync

on:
  push:
    branches:
      - agent/evolve-compatible-source-recipes
    paths:
      - 'src/internal/project_search.h'
      - 'src/internal/project_search_owner.h'
      - '.github/workflows/search-trace-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evolve-compatible-source-recipes
          fetch-depth: 0
      - name: Materialize exact operator trace and dependency authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_function(text: str, start: str, next_start: str, replacement: str) -> str:
              begin = text.index(start)
              end = text.index(next_start, begin)
              return text[:begin] + replacement.rstrip() + "\n\n" + text[end:]

          path = Path('src/project_search.c')
          text = path.read_text()
          start = 'static evo_project_search_birth_event_t *evo_search_record_birth('
          next_start = 'static evo_project_search_operator_kind_t evo_search_select_mutation_kind('
          replacement = r'''static evo_project_search_operator_event_t *evo_search_record_operator_event(
              evo_search_run_context_t *context,
              const void *genome_address,
              evo_project_search_operator_kind_t operator_kind,
              const char *parent_a,
              const char *parent_b,
              const char *result_recipe,
              evo_project_recipe_status_t recipe_status)
          {
              evo_project_search_owner_t *owner = context->owner;
              evo_project_search_operator_event_t *event;
              const size_t index = owner->operator_event_count;

              if (index >= owner->operator_event_capacity) {
                  context->fatal_state = true;
                  return NULL;
              }
              event = &owner->operator_events[index];
              *event = (evo_project_search_operator_event_t){0};
              event->ordinal = index;
              event->operator_kind = operator_kind;
              event->recipe_status = recipe_status;
              event->rejection_reason = evo_search_rejection_from_recipe(recipe_status);
              if (!evo_search_copy_fingerprint(event->parent_a_recipe_fingerprint, parent_a) ||
                  !evo_search_copy_fingerprint(event->parent_b_recipe_fingerprint, parent_b) ||
                  !evo_search_copy_fingerprint(event->result_recipe_fingerprint, result_recipe)) {
                  context->fatal_state = true;
                  return NULL;
              }
              owner->operator_event_genome_addresses[index] = genome_address;
              owner->operator_event_count += 1U;
              return event;
          }

          static evo_project_search_birth_event_t *evo_search_record_birth(
              evo_search_run_context_t *context,
              const void *genome_address,
              const char *parent_a,
              const char *parent_b,
              evo_project_recipe_status_t recipe_status)
          {
              evo_project_search_owner_t *owner = context->owner;
              evo_project_search_birth_event_t *event =
                  evo_search_find_birth(owner, genome_address);

              if (event == NULL) {
                  if (owner->birth_count >= owner->birth_capacity) {
                      context->fatal_state = true;
                      return NULL;
                  }
                  event = &owner->birth_events[owner->birth_count];
                  owner->birth_count += 1U;
                  *event = (evo_project_search_birth_event_t){0};
                  event->genome_address = genome_address;
                  if (!evo_search_copy_fingerprint(
                          event->parent_a_recipe_fingerprint, parent_a) ||
                      !evo_search_copy_fingerprint(
                          event->parent_b_recipe_fingerprint, parent_b)) {
                      context->fatal_state = true;
                      return NULL;
                  }
              }
              event->recipe_status = recipe_status;
              event->rejection_reason = evo_search_rejection_from_recipe(recipe_status);
              return event;
          }

          static size_t evo_search_bind_operator_events(
              evo_project_search_owner_t *owner,
              const void *genome_address,
              evo_project_search_lineage_record_t *record)
          {
              size_t index;
              size_t count = 0U;

              for (index = 0U; index < owner->operator_event_count; index += 1U) {
                  evo_project_search_operator_event_t *event = &owner->operator_events[index];

                  if (event->bound || owner->operator_event_genome_addresses[index] != genome_address) {
                      continue;
                  }
                  event->bound = true;
                  event->generation = record->generation;
                  event->population_index = record->population_index;
                  if (count == 0U) {
                      record->operator_ordinal = event->ordinal;
                  }
                  record->operator_kind = event->operator_kind;
                  count += 1U;
              }
              record->operator_event_count = count;
              return count;
          }'''
          text = replace_function(text, start, next_start, replacement)

          start = 'static void evo_search_initialize_callback(void *genome, void *opaque)'
          next_start = 'static void evo_search_mutate_callback('
          replacement = r'''static void evo_search_initialize_callback(void *genome, void *opaque)
          {
              evo_search_run_context_t *context = opaque;
              evo_project_recipe_t recipe = {0};
              unsigned char *bytes = genome;
              const size_t ordinal = context->owner->operator_event_count;
              const uint64_t selector = evo_search_selector(
                  context->config,
                  "initialize",
                  ordinal,
                  bytes,
                  context->config->genome_size,
                  NULL,
                  0U);
              evo_project_recipe_status_t status = evo_search_initialize_recipe(
                  context->config, selector, &recipe);

              if (status == EVO_PROJECT_RECIPE_SUCCESS &&
                  evo_search_copy_recipe_genome(
                      bytes, &recipe, context->config->genome_size)) {
                  if (evo_search_record_operator_event(
                          context,
                          genome,
                          EVO_PROJECT_SEARCH_OPERATOR_INITIALIZE,
                          NULL,
                          NULL,
                          recipe.recipe_fingerprint,
                          EVO_PROJECT_RECIPE_SUCCESS) != NULL) {
                      (void)evo_search_record_birth(
                          context,
                          genome,
                          NULL,
                          NULL,
                          EVO_PROJECT_RECIPE_SUCCESS);
                  }
              } else {
                  if (status == EVO_PROJECT_RECIPE_SUCCESS) {
                      status = EVO_PROJECT_RECIPE_ERROR_STATE;
                  }
                  evo_search_zero_genome(bytes, context->config->genome_size);
                  if (evo_search_record_operator_event(
                          context,
                          genome,
                          EVO_PROJECT_SEARCH_OPERATOR_INITIALIZE,
                          NULL,
                          NULL,
                          NULL,
                          status) != NULL) {
                      (void)evo_search_record_birth(
                          context, genome, NULL, NULL, status);
                  }
              }
              evo_project_recipe_destroy(&recipe);
          }'''
          text = replace_function(text, start, next_start, replacement)

          start = 'static void evo_search_mutate_callback('
          next_start = 'static void evo_search_crossover_callback('
          replacement = r'''static void evo_search_mutate_callback(
              void *genome,
              double mutation_rate,
              void *opaque)
          {
              evo_search_run_context_t *context = opaque;
              evo_project_recipe_t parent = {0};
              evo_project_recipe_t current = {0};
              evo_project_recipe_t next = {0};
              unsigned char *bytes = genome;
              char original_parent[EVO_PROJECT_FINGERPRINT_TEXT_SIZE] = {0};
              char source_fingerprint[EVO_PROJECT_FINGERPRINT_TEXT_SIZE] = {0};
              char rate_text[64];
              uint64_t selector;
              evo_project_recipe_status_t status;
              evo_project_search_operator_kind_t last_operation =
                  EVO_PROJECT_SEARCH_OPERATOR_MUTATION_ADD;
              size_t operation_count;
              size_t operation_index;
              const int rate_written = evo_project_format(
                  rate_text, sizeof(rate_text), "%.17g", mutation_rate);

              status = evo_project_recipe_decode(
                  &context->config->recipe_context,
                  bytes,
                  context->config->genome_size,
                  &parent);
              if (status != EVO_PROJECT_RECIPE_SUCCESS || rate_written <= 0 ||
                  (size_t)rate_written >= sizeof(rate_text) ||
                  !evo_search_copy_fingerprint(
                      original_parent,
                      status == EVO_PROJECT_RECIPE_SUCCESS
                          ? parent.recipe_fingerprint
                          : NULL) ||
                  !evo_search_copy_fingerprint(source_fingerprint, original_parent)) {
                  if (status == EVO_PROJECT_RECIPE_SUCCESS) {
                      status = EVO_PROJECT_RECIPE_ERROR_STATE;
                  }
                  evo_search_zero_genome(bytes, context->config->genome_size);
                  if (evo_search_record_operator_event(
                          context,
                          genome,
                          last_operation,
                          original_parent,
                          NULL,
                          NULL,
                          status) != NULL) {
                      (void)evo_search_record_birth(
                          context, genome, original_parent, NULL, status);
                  }
                  evo_project_recipe_destroy(&parent);
                  return;
              }
              selector = evo_search_selector(
                  context->config,
                  rate_text,
                  context->owner->operator_event_count,
                  bytes,
                  context->config->genome_size,
                  NULL,
                  0U);
              operation_count = 1U +
                                (size_t)(selector %
                                         (uint64_t)context->config->policy
                                             .max_mutations_per_event);
              for (operation_index = 0U;
                   operation_index < operation_count;
                   operation_index += 1U) {
                  const uint64_t operation_selector =
                      selector + UINT64_C(0x9e3779b97f4a7c15) *
                                     (uint64_t)(operation_index + 1U);
                  const evo_project_search_operator_kind_t operation =
                      evo_search_select_mutation_kind(
                          context->config, operation_selector);
                  const unsigned char *source_genome =
                      operation_index == 0U ? parent.genome : current.genome;

                  evo_project_recipe_destroy(&next);
                  status = evo_search_mutate_recipe(
                      context->config,
                      source_genome,
                      operation,
                      operation_selector,
                      &next);
                  last_operation = operation;
                  if (evo_search_record_operator_event(
                          context,
                          genome,
                          operation,
                          source_fingerprint,
                          NULL,
                          status == EVO_PROJECT_RECIPE_SUCCESS
                              ? next.recipe_fingerprint
                              : NULL,
                          status) == NULL) {
                      status = EVO_PROJECT_RECIPE_ERROR_STATE;
                      break;
                  }
                  if (status != EVO_PROJECT_RECIPE_SUCCESS) {
                      break;
                  }
                  if (!evo_search_copy_fingerprint(
                          source_fingerprint, next.recipe_fingerprint)) {
                      status = EVO_PROJECT_RECIPE_ERROR_STATE;
                      break;
                  }
                  evo_project_recipe_destroy(&current);
                  current = next;
                  next = (evo_project_recipe_t){0};
              }
              if (status == EVO_PROJECT_RECIPE_SUCCESS && current.private_owner != NULL &&
                  evo_search_copy_recipe_genome(
                      bytes, &current, context->config->genome_size)) {
                  (void)evo_search_record_birth(
                      context,
                      genome,
                      original_parent,
                      NULL,
                      EVO_PROJECT_RECIPE_SUCCESS);
              } else {
                  if (status == EVO_PROJECT_RECIPE_SUCCESS) {
                      status = EVO_PROJECT_RECIPE_ERROR_STATE;
                  }
                  evo_search_zero_genome(bytes, context->config->genome_size);
                  (void)evo_search_record_birth(
                      context, genome, original_parent, NULL, status);
              }
              (void)last_operation;
              evo_project_recipe_destroy(&next);
              evo_project_recipe_destroy(&current);
              evo_project_recipe_destroy(&parent);
          }'''
          text = replace_function(text, start, next_start, replacement)

          start = 'static void evo_search_crossover_callback('
          next_start = 'static bool evo_search_outcome_identity_valid('
          replacement = r'''static void evo_search_crossover_callback(
              const void *parent_a,
              const void *parent_b,
              void *child_a,
              void *child_b,
              void *opaque)
          {
              evo_search_run_context_t *context = opaque;
              evo_project_recipe_t decoded_a = {0};
              evo_project_recipe_t decoded_b = {0};
              evo_project_recipe_t crossed_a = {0};
              evo_project_recipe_t crossed_b = {0};
              char parent_a_fingerprint[EVO_PROJECT_FINGERPRINT_TEXT_SIZE] = {0};
              char parent_b_fingerprint[EVO_PROJECT_FINGERPRINT_TEXT_SIZE] = {0};
              evo_project_recipe_status_t status_a;
              evo_project_recipe_status_t status_b;
              evo_project_recipe_status_t status;
              const uint64_t selector = evo_search_selector(
                  context->config,
                  "crossover",
                  context->owner->operator_event_count,
                  parent_a,
                  context->config->genome_size,
                  parent_b,
                  context->config->genome_size);

              status_a = evo_project_recipe_decode(
                  &context->config->recipe_context,
                  parent_a,
                  context->config->genome_size,
                  &decoded_a);
              status_b = evo_project_recipe_decode(
                  &context->config->recipe_context,
                  parent_b,
                  context->config->genome_size,
                  &decoded_b);
              if (status_a == EVO_PROJECT_RECIPE_SUCCESS) {
                  (void)evo_search_copy_fingerprint(
                      parent_a_fingerprint, decoded_a.recipe_fingerprint);
              }
              if (status_b == EVO_PROJECT_RECIPE_SUCCESS) {
                  (void)evo_search_copy_fingerprint(
                      parent_b_fingerprint, decoded_b.recipe_fingerprint);
              }
              if (status_a != EVO_PROJECT_RECIPE_SUCCESS ||
                  status_b != EVO_PROJECT_RECIPE_SUCCESS) {
                  status = status_a != EVO_PROJECT_RECIPE_SUCCESS ? status_a : status_b;
              } else {
                  status = evo_search_crossover_recipes(
                      context->config,
                      parent_a,
                      parent_b,
                      selector,
                      &crossed_a,
                      &crossed_b);
              }
              if (status == EVO_PROJECT_RECIPE_SUCCESS &&
                  evo_search_copy_recipe_genome(
                      child_a, &crossed_a, context->config->genome_size) &&
                  evo_search_copy_recipe_genome(
                      child_b, &crossed_b, context->config->genome_size)) {
                  if (evo_search_record_operator_event(
                          context,
                          child_a,
                          EVO_PROJECT_SEARCH_OPERATOR_CROSSOVER,
                          parent_a_fingerprint,
                          parent_b_fingerprint,
                          crossed_a.recipe_fingerprint,
                          EVO_PROJECT_RECIPE_SUCCESS) != NULL) {
                      (void)evo_search_record_birth(
                          context,
                          child_a,
                          parent_a_fingerprint,
                          parent_b_fingerprint,
                          EVO_PROJECT_RECIPE_SUCCESS);
                  }
                  if (evo_search_record_operator_event(
                          context,
                          child_b,
                          EVO_PROJECT_SEARCH_OPERATOR_CROSSOVER,
                          parent_b_fingerprint,
                          parent_a_fingerprint,
                          crossed_b.recipe_fingerprint,
                          EVO_PROJECT_RECIPE_SUCCESS) != NULL) {
                      (void)evo_search_record_birth(
                          context,
                          child_b,
                          parent_b_fingerprint,
                          parent_a_fingerprint,
                          EVO_PROJECT_RECIPE_SUCCESS);
                  }
              } else {
                  if (status == EVO_PROJECT_RECIPE_SUCCESS) {
                      status = EVO_PROJECT_RECIPE_ERROR_STATE;
                  }
                  evo_search_zero_genome(child_a, context->config->genome_size);
                  evo_search_zero_genome(child_b, context->config->genome_size);
                  if (evo_search_record_operator_event(
                          context,
                          child_a,
                          EVO_PROJECT_SEARCH_OPERATOR_CROSSOVER,
                          parent_a_fingerprint,
                          parent_b_fingerprint,
                          NULL,
                          status) != NULL) {
                      (void)evo_search_record_birth(
                          context,
                          child_a,
                          parent_a_fingerprint,
                          parent_b_fingerprint,
                          status);
                  }
                  if (evo_search_record_operator_event(
                          context,
                          child_b,
                          EVO_PROJECT_SEARCH_OPERATOR_CROSSOVER,
                          parent_b_fingerprint,
                          parent_a_fingerprint,
                          NULL,
                          status) != NULL) {
                      (void)evo_search_record_birth(
                          context,
                          child_b,
                          parent_b_fingerprint,
                          parent_a_fingerprint,
                          status);
                  }
              }
              evo_project_recipe_destroy(&crossed_a);
              evo_project_recipe_destroy(&crossed_b);
              evo_project_recipe_destroy(&decoded_a);
              evo_project_recipe_destroy(&decoded_b);
          }'''
          text = replace_function(text, start, next_start, replacement)

          start = 'static bool evo_search_validate_callback(const void *genome, void *opaque)'
          next_start = 'static evo_fitness_t evo_search_evaluate_callback('
          replacement = r'''static bool evo_search_validate_callback(const void *genome, void *opaque)
          {
              evo_search_run_context_t *context = opaque;
              evo_project_search_owner_t *owner = context->owner;
              evo_project_search_birth_event_t *birth =
                  evo_search_find_birth(owner, genome);
              evo_project_search_lineage_record_t *record;
              evo_project_recipe_t recipe = {0};
              evo_project_search_evaluation_request_t request = {0};
              evo_project_search_evaluation_outcome_t outcome = {0};
              evo_project_search_status_t provider_status;
              evo_project_recipe_status_t recipe_status;
              const size_t ordinal = owner->validation_ordinal;

              owner->validation_ordinal += 1U;
              if (owner->lineage_count >= owner->lineage_capacity ||
                  context->config->population_size == 0U) {
                  context->fatal_state = true;
                  return false;
              }
              record = &owner->lineage[owner->lineage_count];
              *record = (evo_project_search_lineage_record_t){0};
              record->generation = ordinal / context->config->population_size;
              record->population_index = ordinal % context->config->population_size;
              owner->lineage_genome_addresses[owner->lineage_count] = genome;
              owner->lineage_count += 1U;

              if (birth != NULL) {
                  birth->consumed = true;
                  record->rejection_reason = birth->rejection_reason;
                  record->recipe_status = birth->recipe_status;
                  (void)evo_search_copy_fingerprint(
                      record->parent_a_recipe_fingerprint,
                      birth->parent_a_recipe_fingerprint);
                  (void)evo_search_copy_fingerprint(
                      record->parent_b_recipe_fingerprint,
                      birth->parent_b_recipe_fingerprint);
                  if (evo_search_bind_operator_events(owner, genome, record) == 0U) {
                      record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_STATE;
                      context->fatal_state = true;
                      return false;
                  }
                  if (birth->rejection_reason != EVO_PROJECT_SEARCH_REJECTION_NONE) {
                      return false;
                  }
              }

              recipe_status = evo_project_recipe_decode(
                  &context->config->recipe_context,
                  genome,
                  context->config->genome_size,
                  &recipe);
              record->recipe_status = recipe_status;
              if (birth == NULL) {
                  if (evo_search_record_operator_event(
                          context,
                          genome,
                          EVO_PROJECT_SEARCH_OPERATOR_CLONE,
                          recipe_status == EVO_PROJECT_RECIPE_SUCCESS
                              ? recipe.recipe_fingerprint
                              : NULL,
                          NULL,
                          recipe_status == EVO_PROJECT_RECIPE_SUCCESS
                              ? recipe.recipe_fingerprint
                              : NULL,
                          recipe_status) == NULL ||
                      evo_search_bind_operator_events(owner, genome, record) == 0U) {
                      record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_STATE;
                      context->fatal_state = true;
                      evo_project_recipe_destroy(&recipe);
                      return false;
                  }
              }
              if (recipe_status != EVO_PROJECT_RECIPE_SUCCESS) {
                  record->rejection_reason =
                      evo_search_rejection_from_recipe(recipe_status);
                  evo_project_recipe_destroy(&recipe);
                  return false;
              }
              if (!evo_search_copy_fingerprint(
                      record->recipe_fingerprint, recipe.recipe_fingerprint)) {
                  record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_STATE;
                  context->fatal_state = true;
                  evo_project_recipe_destroy(&recipe);
                  return false;
              }
              if (birth == NULL) {
                  (void)evo_search_copy_fingerprint(
                      record->parent_a_recipe_fingerprint, recipe.recipe_fingerprint);
              }

              request.schema_version = EVO_PROJECT_SEARCH_SCHEMA_VERSION;
              request.random_seed = context->config->random_seed;
              request.generation = record->generation;
              request.population_index = record->population_index;
              request.provider_identity = context->config->evaluation_provider_identity;
              request.recipe = &recipe;
              outcome.schema_version = EVO_PROJECT_SEARCH_SCHEMA_VERSION;
              provider_status = context->config->evaluation_provider(
                  &request,
                  context->config->evaluation_provider_context,
                  &outcome);
              if (provider_status != EVO_PROJECT_SEARCH_SUCCESS ||
                  outcome.schema_version != EVO_PROJECT_SEARCH_SCHEMA_VERSION ||
                  !outcome.accepted) {
                  record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_PROVIDER;
                  evo_project_recipe_destroy(&recipe);
                  return false;
              }
              if (!outcome.correctness_preserved) {
                  record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_CORRECTNESS;
                  evo_project_recipe_destroy(&recipe);
                  return false;
              }
              if (!outcome.performance_eligible) {
                  record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_ASSURANCE;
                  evo_project_recipe_destroy(&recipe);
                  return false;
              }
              if (!outcome.fitness_available) {
                  record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_MEASUREMENT;
                  evo_project_recipe_destroy(&recipe);
                  return false;
              }
              if (!evo_search_copy_outcome(context->config, &outcome, record)) {
                  record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_PROVIDER;
                  context->fatal_state = true;
                  evo_project_recipe_destroy(&recipe);
                  return false;
              }
              record->valid = true;
              record->rejection_reason = EVO_PROJECT_SEARCH_REJECTION_NONE;
              evo_project_recipe_destroy(&recipe);
              return true;
          }'''
          text = replace_function(text, start, next_start, replacement)

          text = text.replace(
              '''    owner->birth_events = evo_project_allocate_zeroed(\n        config->limits.max_operator_events, sizeof(*owner->birth_events));\n    if (owner->lineage == NULL || owner->lineage_genome_addresses == NULL ||\n        owner->birth_events == NULL) {\n        evo_project_release(owner->lineage);\n        evo_project_release(owner->lineage_genome_addresses);\n        evo_project_release(owner->birth_events);\n        evo_project_release(owner);\n        return false;\n    }\n    owner->lineage_capacity = lineage_capacity;\n    owner->birth_capacity = config->limits.max_operator_events;\n''',
              '''    owner->operator_events = evo_project_allocate_zeroed(\n        config->limits.max_operator_events, sizeof(*owner->operator_events));\n    owner->operator_event_genome_addresses = evo_project_allocate_zeroed(\n        config->limits.max_operator_events,\n        sizeof(*owner->operator_event_genome_addresses));\n    owner->birth_events = evo_project_allocate_zeroed(\n        config->limits.max_operator_events, sizeof(*owner->birth_events));\n    if (owner->lineage == NULL || owner->lineage_genome_addresses == NULL ||\n        owner->operator_events == NULL ||\n        owner->operator_event_genome_addresses == NULL ||\n        owner->birth_events == NULL) {\n        evo_project_release(owner->lineage);\n        evo_project_release(owner->lineage_genome_addresses);\n        evo_project_release(owner->operator_events);\n        evo_project_release(owner->operator_event_genome_addresses);\n        evo_project_release(owner->birth_events);\n        evo_project_release(owner);\n        return false;\n    }\n    owner->lineage_capacity = lineage_capacity;\n    owner->operator_event_capacity = config->limits.max_operator_events;\n    owner->birth_capacity = config->limits.max_operator_events;\n''',
              1,
          )
          text = text.replace(
              '''    evo_project_release(owner->lineage);\n    evo_project_release(owner->lineage_genome_addresses);\n    evo_project_release(owner->birth_events);\n''',
              '''    evo_project_release(owner->operator_events);\n    evo_project_release(owner->operator_event_genome_addresses);\n    evo_project_release(owner->lineage);\n    evo_project_release(owner->lineage_genome_addresses);\n    evo_project_release(owner->birth_events);\n''',
              1,
          )
          text = text.replace(
              '''    owner->view.population_size = config->population_size;\n    owner->view.lineage = owner->lineage;\n''',
              '''    owner->view.population_size = config->population_size;\n    owner->view.operator_events = owner->operator_events;\n    owner->view.lineage = owner->lineage;\n''',
              1,
          )
          text = text.replace(
              '''    owner->view.lineage_count = owner->lineage_count;\n\n    for (index = 0U; index < owner->lineage_count; index += 1U) {\n''',
              '''    owner->view.operator_event_count = owner->operator_event_count;\n    owner->view.lineage_count = owner->lineage_count;\n\n    for (index = 0U; index < owner->operator_event_count; index += 1U) {\n        if (!owner->operator_events[index].bound) {\n            evo_project_recipe_destroy(&best_recipe);\n            return false;\n        }\n    }\n\n    for (index = 0U; index < owner->lineage_count; index += 1U) {\n''',
              1,
          )
          fingerprint_marker = '''    evo_project_fingerprint_u64(\n        &fingerprint, (uint64_t)owner->view.termination_reason);\n    for (index = 0U; index < owner->lineage_count; index += 1U) {\n'''
          fingerprint_insert = '''    evo_project_fingerprint_u64(\n        &fingerprint, (uint64_t)owner->view.termination_reason);\n    for (index = 0U; index < owner->operator_event_count; index += 1U) {\n        const evo_project_search_operator_event_t *event =\n            &owner->operator_events[index];\n\n        evo_project_fingerprint_u64(&fingerprint, (uint64_t)event->ordinal);\n        evo_project_fingerprint_u64(&fingerprint, (uint64_t)event->generation);\n        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)event->population_index);\n        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)event->operator_kind);\n        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)event->rejection_reason);\n        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)event->recipe_status);\n        evo_project_fingerprint_string(\n            &fingerprint, event->parent_a_recipe_fingerprint);\n        evo_project_fingerprint_string(\n            &fingerprint, event->parent_b_recipe_fingerprint);\n        evo_project_fingerprint_string(\n            &fingerprint, event->result_recipe_fingerprint);\n    }\n    for (index = 0U; index < owner->lineage_count; index += 1U) {\n'''
          if fingerprint_marker not in text:
              raise SystemExit('search fingerprint marker not found')
          text = text.replace(fingerprint_marker, fingerprint_insert, 1)
          text = text.replace(
              '''        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)record->operator_kind);\n        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)record->rejection_reason);\n''',
              '''        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)record->operator_kind);\n        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)record->operator_event_count);\n        evo_project_fingerprint_u64(\n            &fingerprint, (uint64_t)record->rejection_reason);\n''',
              1,
          )
          path.write_text(text)

          path = Path('src/project_search_runtime.c')
          text = path.read_text()
          old = r'''static evo_project_recipe_status_t evo_search_add_dependency(
              const evo_project_search_config_t *config,
              evo_project_search_mutable_recipe_t *mutable_recipe,
              const evo_project_transformation_reference_t *dependency)
          {
              const evo_project_transformation_catalogue_entry_t *entry =
                  evo_search_catalogue_entry(
                      config, dependency->identity, dependency->implementation_version);
              size_t opportunity_index;

              if (entry == NULL) {
                  return EVO_PROJECT_RECIPE_ERROR_UNKNOWN_TRANSFORMATION;
              }
              if (mutable_recipe->record_count >= mutable_recipe->capacity) {
                  return EVO_PROJECT_RECIPE_ERROR_RESOURCE_LIMIT;
              }
              for (opportunity_index = 0U;
                   opportunity_index < config->recipe_context.analysis->opportunity_count;
                   opportunity_index += 1U) {
                  const char *target =
                      config->recipe_context.analysis->opportunities[opportunity_index]
                          .location_identity;

                  if (evo_search_entry_allowed_at_target(config, entry, target) &&
                      !evo_search_logical_duplicate(
                          mutable_recipe,
                          target,
                          entry->identity,
                          entry->implementation_version,
                          SIZE_MAX)) {
                      const size_t record_index = mutable_recipe->record_count;

                      if (!evo_search_set_catalogue_record(
                              config, mutable_recipe, record_index, target, entry)) {
                          return EVO_PROJECT_RECIPE_ERROR_RESOURCE_LIMIT;
                      }
                      mutable_recipe->record_count += 1U;
                      return EVO_PROJECT_RECIPE_SUCCESS;
                  }
              }
              return EVO_PROJECT_RECIPE_ERROR_DEPENDENCY_MISSING;
          }'''
          new = r'''static evo_project_recipe_status_t evo_search_add_dependency(
              const evo_project_search_config_t *config,
              evo_project_search_mutable_recipe_t *mutable_recipe,
              const evo_project_transformation_reference_t *dependency)
          {
              const evo_project_transformation_catalogue_entry_t *entry =
                  evo_search_catalogue_entry(
                      config, dependency->identity, dependency->implementation_version);
              const char *selected_target = NULL;
              size_t match_count = 0U;
              size_t opportunity_index;

              if (entry == NULL) {
                  return EVO_PROJECT_RECIPE_ERROR_UNKNOWN_TRANSFORMATION;
              }
              if (mutable_recipe->record_count >= mutable_recipe->capacity) {
                  return EVO_PROJECT_RECIPE_ERROR_RESOURCE_LIMIT;
              }
              for (opportunity_index = 0U;
                   opportunity_index < config->recipe_context.analysis->opportunity_count;
                   opportunity_index += 1U) {
                  const char *target =
                      config->recipe_context.analysis->opportunities[opportunity_index]
                          .location_identity;

                  if (evo_search_entry_allowed_at_target(config, entry, target) &&
                      !evo_search_logical_duplicate(
                          mutable_recipe,
                          target,
                          entry->identity,
                          entry->implementation_version,
                          SIZE_MAX)) {
                      selected_target = target;
                      match_count += 1U;
                      if (match_count > 1U) {
                          return EVO_PROJECT_RECIPE_ERROR_DEPENDENCY_AMBIGUOUS;
                      }
                  }
              }
              if (match_count == 0U || selected_target == NULL) {
                  return EVO_PROJECT_RECIPE_ERROR_DEPENDENCY_MISSING;
              }
              if (!evo_search_set_catalogue_record(
                      config,
                      mutable_recipe,
                      mutable_recipe->record_count,
                      selected_target,
                      entry)) {
                  return EVO_PROJECT_RECIPE_ERROR_RESOURCE_LIMIT;
              }
              mutable_recipe->record_count += 1U;
              return EVO_PROJECT_RECIPE_SUCCESS;
          }'''
          if old not in text:
              raise SystemExit('dependency function marker not found')
          text = text.replace(old, new, 1)

          old = '!evo_search_append_bool(json, config->policy.integer_parameter_wrap) ||\n        !evo_candidate_buffer_append_text(json, "},\\\"lineage\\\":[")) {'
          if old not in text:
              raise SystemExit('runtime JSON lineage marker not found')
          new = '''!evo_search_append_bool(json, config->policy.integer_parameter_wrap) ||\n        !evo_candidate_buffer_append_text(json, "},\\\"operator_events\\\":[")) {'''
          text = text.replace(old, new, 1)
          marker = '    for (index = 0U; index < owner->lineage_count; index += 1U) {\n        const evo_project_search_lineage_record_t *record =\n            &owner->lineage[index];\n'
          first = text.index(marker, text.index('static bool evo_search_build_json('))
          operator_loop = r'''    for (index = 0U; index < owner->operator_event_count; index += 1U) {
              const evo_project_search_operator_event_t *event =
                  &owner->operator_events[index];

              if (!event->bound) {
                  return false;
              }
              if (index > 0U && !evo_candidate_buffer_append_text(json, ",")) {
                  return false;
              }
              if (!evo_candidate_buffer_append_text(json, "{") ||
                  !evo_candidate_buffer_append_text(json, "\"ordinal\":") ||
                  !evo_candidate_buffer_append_size(json, event->ordinal) ||
                  !evo_candidate_buffer_append_text(json, ",\"generation\":") ||
                  !evo_candidate_buffer_append_size(json, event->generation) ||
                  !evo_candidate_buffer_append_text(json, ",\"population_index\":") ||
                  !evo_candidate_buffer_append_size(json, event->population_index) ||
                  !evo_candidate_buffer_append_text(json, ",\"operator_kind\":") ||
                  !evo_candidate_buffer_append_json_string(
                      json, evo_project_search_operator_kind_name(event->operator_kind)) ||
                  !evo_candidate_buffer_append_text(json, ",\"rejection_reason\":") ||
                  !evo_candidate_buffer_append_json_string(
                      json,
                      evo_project_search_rejection_reason_name(
                          event->rejection_reason)) ||
                  !evo_candidate_buffer_append_text(json, ",\"recipe_status\":") ||
                  !evo_candidate_buffer_append_json_string(
                      json, evo_project_recipe_status_name(event->recipe_status)) ||
                  !evo_candidate_buffer_append_text(json, ",") ||
                  !evo_search_append_json_string_field(
                      json,
                      "parent_a_recipe_fingerprint",
                      event->parent_a_recipe_fingerprint,
                      true) ||
                  !evo_search_append_json_string_field(
                      json,
                      "parent_b_recipe_fingerprint",
                      event->parent_b_recipe_fingerprint,
                      true) ||
                  !evo_search_append_json_string_field(
                      json,
                      "result_recipe_fingerprint",
                      event->result_recipe_fingerprint,
                      true) ||
                  !evo_candidate_buffer_append_text(json, "\"bound\":true}")) {
                  return false;
              }
          }
          if (!evo_candidate_buffer_append_text(json, "],\"lineage\":[")) {
              return false;
          }
          '''
          text = text[:first] + operator_loop + text[first:]
          line_marker = '''            !evo_candidate_buffer_append_text(json, ",\\\"operator_kind\\\":") ||\n            !evo_candidate_buffer_append_json_string(\n                json, evo_project_search_operator_kind_name(record->operator_kind)) ||\n            !evo_candidate_buffer_append_text(json, ",\\\"rejection_reason\\\":") ||'''
          line_replace = '''            !evo_candidate_buffer_append_text(json, ",\\\"operator_kind\\\":") ||\n            !evo_candidate_buffer_append_json_string(\n                json, evo_project_search_operator_kind_name(record->operator_kind)) ||\n            !evo_candidate_buffer_append_text(json, ",\\\"operator_event_count\\\":") ||\n            !evo_candidate_buffer_append_size(json, record->operator_event_count) ||\n            !evo_candidate_buffer_append_text(json, ",\\\"rejection_reason\\\":") ||'''
          if line_marker not in text:
              raise SystemExit('lineage event count marker not found')
          text = text.replace(line_marker, line_replace, 1)

          md_marker = '            "## Ordered lineage\\n\\n| Generation | Index | Operator | Recipe | Parent A | Parent B | Valid | Evaluated | Total | Rejection | Winner |\\n|---:|---:|---|---|---|---|---|---|---:|---|---|\\n")) {'
          if md_marker not in text:
              raise SystemExit('markdown lineage marker not found')
          md_replace = '            "## Operator events\\n\\n| Ordinal | Generation | Index | Operator | Parent A | Parent B | Result recipe | Status | Rejection |\\n|---:|---:|---:|---|---|---|---|---|---|\\n")) {'
          text = text.replace(md_marker, md_replace, 1)
          md_loop_marker = '    for (index = 0U; index < owner->lineage_count; index += 1U) {\n        const evo_project_search_lineage_record_t *record =\n            &owner->lineage[index];\n        char row[640];\n'
          md_start = text.index(md_loop_marker, text.index('static bool evo_search_build_markdown('))
          md_operator = r'''    for (index = 0U; index < owner->operator_event_count; index += 1U) {
              const evo_project_search_operator_event_t *event =
                  &owner->operator_events[index];
              char row[704];
              const int written = evo_project_format(
                  row,
                  sizeof(row),
                  "| %zu | %zu | %zu | %s | %s | %s | %s | %s | %s |\n",
                  event->ordinal,
                  event->generation,
                  event->population_index,
                  evo_project_search_operator_kind_name(event->operator_kind),
                  event->parent_a_recipe_fingerprint,
                  event->parent_b_recipe_fingerprint,
                  event->result_recipe_fingerprint,
                  evo_project_recipe_status_name(event->recipe_status),
                  evo_project_search_rejection_reason_name(event->rejection_reason));

              if (!event->bound || written <= 0 || (size_t)written >= sizeof(row) ||
                  !evo_candidate_buffer_append_text(markdown, row)) {
                  return false;
              }
          }
          if (!evo_candidate_buffer_append_text(
                  markdown,
                  "\n## Ordered lineage\n\n| Generation | Index | Operator | Operator events | Recipe | Parent A | Parent B | Valid | Evaluated | Total | Rejection | Winner |\n|---:|---:|---|---:|---|---|---|---|---|---:|---|---|\n")) {
              return false;
          }
          '''
          text = text[:md_start] + md_operator + text[md_start:]
          text = text.replace(
              '"| %zu | %zu | %s | %s | %s | %s | %s | %s | %.17g | %s | %s |\\n",',
              '"| %zu | %zu | %s | %zu | %s | %s | %s | %s | %s | %.17g | %s | %s |\\n",',
              1,
          )
          text = text.replace(
              '''            evo_project_search_operator_kind_name(record->operator_kind),\n            record->recipe_fingerprint,''',
              '''            evo_project_search_operator_kind_name(record->operator_kind),\n            record->operator_event_count,\n            record->recipe_fingerprint,''',
              1,
          )
          path.write_text(text)

          path = Path('docs/schemas/evo-project-search-v1.schema.json')
          data = __import__('json').loads(path.read_text())
          required = data['required']
          if 'operator_events' not in required:
              required.insert(required.index('lineage'), 'operator_events')
          data['properties']['operator_events'] = {
              'type': 'array',
              'items': {'$ref': '#/$defs/operatorEvent'},
          }
          data['$defs']['operatorEvent'] = {
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'ordinal', 'generation', 'population_index', 'operator_kind',
                  'rejection_reason', 'recipe_status',
                  'parent_a_recipe_fingerprint', 'parent_b_recipe_fingerprint',
                  'result_recipe_fingerprint', 'bound'
              ],
              'properties': {
                  'ordinal': {'type': 'integer', 'minimum': 0},
                  'generation': {'type': 'integer', 'minimum': 0},
                  'population_index': {'type': 'integer', 'minimum': 0},
                  'operator_kind': {'enum': [
                      'initialize', 'mutation-add', 'mutation-remove',
                      'mutation-parameterize', 'mutation-replace',
                      'mutation-reorder', 'crossover', 'clone'
                  ]},
                  'rejection_reason': data['$defs']['lineage']['properties']['rejection_reason'],
                  'recipe_status': {'type': 'string', 'minLength': 1, 'maxLength': 64},
                  'parent_a_recipe_fingerprint': {'$ref': '#/$defs/optionalIdentity'},
                  'parent_b_recipe_fingerprint': {'$ref': '#/$defs/optionalIdentity'},
                  'result_recipe_fingerprint': {'$ref': '#/$defs/optionalIdentity'},
                  'bound': {'const': True},
              },
          }
          lineage_required = data['$defs']['lineage']['required']
          if 'operator_event_count' not in lineage_required:
              lineage_required.insert(lineage_required.index('rejection_reason'), 'operator_event_count')
          data['$defs']['lineage']['properties']['operator_event_count'] = {
              'type': 'integer', 'minimum': 1
          }
          path.write_text(__import__('json').dumps(data, indent=2) + '\n')

          path = Path('tests/project_search_test.c')
          text = path.read_text()
          text = text.replace(
              '.max_mutations_per_event = 1U,',
              '.max_mutations_per_event = 2U,',
              1,
          )
          test_marker = '''    test_check(\n        first.projection_complete && !first.probabilistic_authority &&\n            !first.raw_source_bytes && first.canonical_json != NULL &&\n'''
          test_replace = '''    test_check(\n        first.operator_event_count >= first.lineage_count &&\n            first.operator_events != NULL,\n        "complete structured operator trace is retained");\n    test_check(\n        first.projection_complete && !first.probabilistic_authority &&\n            !first.raw_source_bytes && first.canonical_json != NULL &&\n'''
          if test_marker not in text:
              raise SystemExit('search evidence test marker not found')
          text = text.replace(test_marker, test_replace, 1)
          text = text.replace(
              '''            strstr(first.canonical_json, "\\\"raw_source_bytes\\\":false") != NULL &&\n''',
              '''            strstr(first.canonical_json, "\\\"operator_events\\\":[") != NULL &&\n            strstr(first.canonical_json, "\\\"raw_source_bytes\\\":false") != NULL &&\n''',
              1,
          )
          path.write_text(text)

          path = Path('tests/validate_project_search.py')
          text = path.read_text()
          text = text.replace(
              '''    require(\n        "evo_project_search_lineage_record" in header,\n        "lineage result model missing",\n    )\n''',
              '''    require(\n        "evo_project_search_lineage_record" in header,\n        "lineage result model missing",\n    )\n    require(\n        "evo_project_search_operator_event" in header,\n        "complete operator-event model missing",\n    )\n''',
              1,
          )
          text = text.replace(
              '''    require("evo_search_repair" in runtime, "deterministic repair boundary missing")\n''',
              '''    require("evo_search_repair" in runtime, "deterministic repair boundary missing")\n    require(\n        "EVO_PROJECT_RECIPE_ERROR_DEPENDENCY_AMBIGUOUS" in runtime\n        and "match_count > 1U" in runtime,\n        "dependency repair must reject non-unique compatible targets",\n    )\n''',
              1,
          )
          text = text.replace(
              '''        "lineage",\n        "best",\n''',
              '''        "operator_events",\n        "lineage",\n        "best",\n''',
              1,
          )
          text = text.replace(
              '''    lineage_required = set(schema["$defs"]["lineage"]["required"])\n''',
              '''    operator_required = set(schema["$defs"]["operatorEvent"]["required"])\n    for field in (\n        "ordinal",\n        "generation",\n        "population_index",\n        "operator_kind",\n        "recipe_status",\n        "result_recipe_fingerprint",\n        "bound",\n    ):\n        require(field in operator_required, f"operator event schema field missing: {field}")\n    require(\n        schema["$defs"]["operatorEvent"]["properties"]["bound"].get("const") is True,\n        "published operator events must be bound to lineage coordinates",\n    )\n    lineage_required = set(schema["$defs"]["lineage"]["required"])\n''',
              1,
          )
          text = text.replace(
              '''        "operator_kind",\n        "recipe_fingerprint",\n''',
              '''        "operator_kind",\n        "operator_event_count",\n        "recipe_fingerprint",\n''',
              1,
          )
          path.write_text(text)
          PY
      - name: Canonicalize changed C
        run: >-
          clang-format -i
          src/internal/project_search.h
          src/internal/project_search_owner.h
          src/project_search.c
          src/project_search_runtime.c
          tests/project_search_test.c
      - name: Commit structured trace
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add src/internal/project_search.h src/internal/project_search_owner.h src/project_search.c src/project_search_runtime.c tests/project_search_test.c tests/validate_project_search.py docs/schemas/evo-project-search-v1.schema.json
          git commit -m 'feat: retain complete structured search operator trace'
          git push origin HEAD:agent/evolve-compatible-source-recipes
      - name: Verify independent contract
        run: python3 tests/validate_project_search.py
      - name: Verify CMake oracle
        run: |
          cmake -S . -B build-search -DCMAKE_C_COMPILER=clang
          cmake --build build-search --target evo_project_search_test --parallel 2
          ctest --test-dir build-search -R '^evo_project_search_test$' --output-on-failure
      - name: Verify Autotools oracle
        run: |
          autoreconf -fi
          ./configure CC=gcc
          make -j2 tests/evo_project_search_test
          make check TESTS=tests/evo_project_search_test
