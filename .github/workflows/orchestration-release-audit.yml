name: Orchestration Release Audit

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-release-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
      - name: Locate stale release boundaries
        run: |
          printf '%s\n' '--- 0.41.0 references ---'
          git grep -n '0\.41\.0' -- ':!docs/adr/**' ':!docs/engineering/reports/**' || true
          printf '%s\n' '--- version macros ---'
          git grep -n 'EVO_VERSION_\|project(catalyst_evo VERSION\|AC_INIT' -- CMakeLists.txt configure.ac include || true
          printf '%s\n' '--- orchestration future wording ---'
          git grep -n -E 'Issue #66 is the next|Bounded external-process orchestration.*remain|Bounded parallel compilation, checkpoint/resume' -- README.md docs || true
          printf '%s\n' '--- build inventory counts ---'
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.aems/aes-bld-001.json').read_text())
          sources = manifest['build']['production_sources']
          tests = manifest['build']['normative_tests']
          core = [path for path in sources if not path.startswith('src/project_')]
          project = [path for path in sources if path.startswith('src/project_')]
          print(f'production_sources={len(sources)}')
          print(f'core_sources={len(core)}')
          print(f'project_sources={len(project)}')
          print(f'normative_tests={len(tests)}')
          PY
