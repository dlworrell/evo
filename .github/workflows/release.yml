name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Proposed release version or tag
        required: true
        type: string
      release_type:
        description: Release classification
        required: true
        default: candidate
        type: choice
        options: [candidate, production, documentation]

permissions:
  actions: read
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Aggregate exact-SHA release gates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_readiness.py
          --repository "${{ github.repository }}"
          --commit "${{ github.sha }}"
          --version "${{ inputs.version }}"
          --release-type "${{ inputs.release_type }}"
          --output build/release-readiness

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/release-readiness/report.md ]]; then
            cat build/release-readiness/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-readiness-${{ inputs.version }}-${{ github.run_id }}
          path: build/release-readiness/
          if-no-files-found: warn
          retention-days: 365
