name: Validate Current Orchestration Stack

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-validation-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
      - name: Configure
        run: cmake -S . -B build-current -DCMAKE_C_COMPILER=clang -DEVO_ENABLE_SANITIZERS=ON
      - name: Build focused targets
        run: cmake --build build-current --target evo_project_search_test evo_project_orchestration_test evo_project_orchestration_checkpoint_test --parallel 2
      - name: Run focused targets
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-current -R '^evo_project_(search|orchestration|orchestration_checkpoint)_test$' --output-on-failure
      - name: Independent validation
        run: python3 tests/validate_project_orchestration.py

  autotools-gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
      - run: autoreconf -fi
      - run: ./configure CC=gcc
      - name: Build focused targets
        run: make -j2 tests/evo_project_search_test tests/evo_project_orchestration_test tests/evo_project_orchestration_checkpoint_test
      - name: Run focused targets
        run: make check TESTS='tests/evo_project_search_test tests/evo_project_orchestration_test tests/evo_project_orchestration_checkpoint_test'
      - name: Independent validation
        run: python3 tests/validate_project_orchestration.py
