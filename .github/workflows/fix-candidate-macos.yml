name: Fix Candidate macOS Fixture

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Canonicalize the candidate fixture root
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/project_candidate_test.c')
          text = path.read_text(encoding='utf-8')
          old = '''    written = evo_project_format(\n        fixture->root, sizeof(fixture->root), "%s", root);\n    if (written <= 0 || (size_t)written >= sizeof(fixture->root)) {\n        return false;\n    }\n'''
          new = '''    if (realpath(root, fixture->root) == NULL) {\n        return false;\n    }\n'''
          if old not in text:
              raise SystemExit('expected fixture-root block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-candidate-macos.yml
          git add tests/project_candidate_test.c
          git commit -m "test: canonicalize candidate fixture paths on macOS"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
