name: Stage Clean EVO 0.41 Landing

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/land-v041-main-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/land-v041-main-clean
          fetch-depth: 0
      - name: Apply exact PR 104 delta onto current main
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git diff --binary 9a059346496f5451c0cd4aefae2a92ee94622ca3 ff573d1319df01fac372c6bf30d63fa0a5ac6c4a -- . | git apply --index
          git diff --cached --check
      - name: Validate focused structured-search landing
        run: |
          cmake -S . -B build-land-v041 -DCMAKE_C_COMPILER=clang -DEVO_ENABLE_SANITIZERS=ON
          cmake --build build-land-v041 --target evo_project_search_test catalyst_evo_project_foundation --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-land-v041 -R '^evo_project_search_test$' --output-on-failure
          python3 tests/validate_project_search.py
      - name: Commit clean landing delta
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git commit -m 'feat: land EVO 0.41 structured recipe evolution'
          git push origin HEAD:agent/land-v041-main-clean
