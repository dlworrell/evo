name: Reconcile EVO 0.42 Core Interface

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-core-version-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Preserve installed-core version and update structural oracle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path('include/catalyst/evo/evo.h')
          text = header.read_text()
          old = '#define EVO_VERSION_MINOR 42\n'
          new = '#define EVO_VERSION_MINOR 37\n'
          if old not in text:
              raise SystemExit('public version macro marker missing')
          header.write_text(text.replace(old, new, 1))

          validator = Path('tests/validate_project_search.py')
          text = validator.read_text()
          old = '    require("evo_run(&problem" in transaction, "deterministic EVO core is not used")\n'
          new = '''    require(\n        "evo_run(" in transaction\n        and "evo_run_with_batch_evaluator(" in transaction,\n        "deterministic EVO core and bounded batch path are not both wired",\n    )\n    require(\n        "core_config.evaluation_worker_count = 0U" in transaction,\n        "structured-search callbacks must not masquerade as external process workers",\n    )\n'''
          if old not in text:
              raise SystemExit('structured-search core oracle marker missing')
          validator.write_text(text.replace(old, new, 1))

          contract = Path('docs/specs/EVO-001-library-contract.md')
          text = contract.read_text()
          old = '''core packaged through version 0.42.0. Version 0.42.0 changes no installed\ncore semantics; its new implementation is confined to the private source-\noptimizer bounded external-process orchestration foundation.\n'''
          new = '''core packaged through version 0.42.0. Version 0.42.0 changes no installed\ncore semantics; its new implementation is confined to the private source-\noptimizer bounded external-process orchestration foundation. The installed\n`EVO_VERSION_*` interface therefore remains 0.37.0; package/source-optimizer\nversion advancement does not manufacture a public core semantic release.\n'''
          if old not in text:
              raise SystemExit('EVO-001 package/core boundary marker missing')
          contract.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused fixes
        run: |
          grep -F '#define EVO_VERSION_MINOR 37' include/catalyst/evo/evo.h
          python3 tests/validate_project_search.py
          grep -F '`EVO_VERSION_*` interface therefore remains 0.37.0' docs/specs/EVO-001-library-contract.md
      - name: Commit non-workflow fixes
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add include/catalyst/evo/evo.h tests/validate_project_search.py docs/specs/EVO-001-library-contract.md
          git commit -m 'fix: preserve stable installed core interface in EVO 0.42'
          git push origin HEAD:agent/bounded-source-orchestration
