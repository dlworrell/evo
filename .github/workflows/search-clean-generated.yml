name: Clean Structured Search Build Residue

on:
  push:
    branches:
      - agent/evolve-compatible-source-recipes
    paths:
      - '.github/workflows/search-clean-generated.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/evolve-compatible-source-recipes
          fetch-depth: 0
      - name: Restore only intended finalization changes
        run: |
          set -euo pipefail
          base=a33dcb73097467767ff166bce86adabbb06ae2cf
          keep_file() {
            case "$1" in
              .aems/aes-bld-001.json|CMakeLists.txt|configure.ac|tests/project_search_test.c)
                return 0 ;;
              .github/workflows/search-finalize-v2.yml|.github/workflows/search-scaffold-sync.yml|.github/workflows/search-trace-sync.yml)
                return 0 ;;
              *)
                return 1 ;;
            esac
          }
          while IFS= read -r path; do
            if keep_file "$path"; then
              continue
            fi
            if git cat-file -e "$base:$path" 2>/dev/null; then
              git checkout "$base" -- "$path"
            else
              git rm -rf --ignore-unmatch "$path"
            fi
          done < <(git diff --name-only "$base"..HEAD)
          rm -f .github/workflows/search-clean-generated.yml
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A
          git commit -m 'chore: remove generated structured search build residue'
          git push origin HEAD:agent/evolve-compatible-source-recipes
