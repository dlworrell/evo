name: Fix Orchestration Fixture Initializers

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/orchestration-fixture-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Complete candidate request initializers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/project_orchestration_test.c')
          text = path.read_text()
          for index in range(4):
              old = f'     "generation-3-candidate-{index}"}}'
              new = f'     "generation-3-candidate-{index}",\n     UINT64_C(0),\n     NULL}}'
              if old in text:
                  text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          clang-format -i tests/project_orchestration_test.c
      - name: Commit correction and remove helper
        run: |
          rm -f .github/workflows/orchestration-fixture-fix.yml
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add tests/project_orchestration_test.c .github/workflows/orchestration-fixture-fix.yml
          git commit -m 'test: complete orchestration request fixtures'
          git push origin HEAD:agent/bounded-source-orchestration
