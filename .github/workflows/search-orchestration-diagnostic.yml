name: Structured Search Integration Diagnostic

on:
  push:
    branches:
      - agent/bounded-source-orchestration
    paths:
      - '.github/workflows/search-orchestration-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/bounded-source-orchestration
          fetch-depth: 0
      - name: Build search oracle
        run: |
          cmake -S . -B build-diagnostic -DCMAKE_C_COMPILER=clang
          cmake --build build-diagnostic --target evo_project_search_test --parallel 2
      - name: Capture search oracle output
        run: |
          set +e
          ./build-diagnostic/tests/evo_project_search_test > /tmp/project-search-diagnostic.txt 2>&1
          status=$?
          cat /tmp/project-search-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            cp /tmp/project-search-diagnostic.txt .github/project-search-orchestration-diagnostic.txt
            git config user.name 'Donovan Worrell'
            git config user.email 'donovan.worrell@just-a-geek.com'
            git add .github/project-search-orchestration-diagnostic.txt
            git commit -m 'diagnostic: capture orchestrated search integration regression'
            git push origin HEAD:agent/bounded-source-orchestration
            exit "$status"
          fi
