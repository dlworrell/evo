name: Project Transformation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-clang:
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure transformation foundation with sanitizers
        run: >-
          cmake -S . -B build/project-transformation-cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DEVO_ENABLE_SANITIZERS=ON

      - name: Build and run the normative transformation target
        run: |
          cmake --build build/project-transformation-cmake \
            --target evo_project_transformation_test --parallel
          ctest --test-dir build/project-transformation-cmake \
            --output-on-failure -R '^evo_project_transformation_test$'

      - name: Analyze the transformation implementation
        run: |
          for file in \
            src/project_transformation.c \
            src/project_transformation_catalogue.c \
            src/project_transformation_model.c \
            src/project_transformation_evidence.c; do
            clang --analyze -Xanalyzer -analyzer-output=text \
              -std=c17 -Wall -Wextra -Wpedantic -Wconversion \
              -Wsign-conversion -Wshadow -Werror \
              -Iinclude -Isrc "$file"
          done

      - name: Validate C fixtures, schemas, and independent goldens
        run: |
          clang -std=c17 -Wall -Wextra -Wpedantic -Wconversion \
            -Wsign-conversion -Wshadow -Werror -fsyntax-only \
            tests/fixtures/project-transformation/before.c \
            tests/fixtures/project-transformation/after.c
          python3 -m json.tool \
            docs/schemas/evo-c-transformation-catalogue-v1.schema.json \
            >/dev/null
          python3 -m json.tool \
            docs/schemas/evo-c-transformation-application-v1.schema.json \
            >/dev/null
          python3 tests/validate_project_transformation.py

  autotools-gcc:
    runs-on: ubuntu-24.04
    env:
      CC: gcc
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Autotools dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Configure transformation foundation
        run: |
          autoreconf -fi
          mkdir -p build/project-transformation-autotools
          cd build/project-transformation-autotools
          ../../configure --enable-warnings-as-errors

      - name: Build and run the normative transformation target
        run: |
          make -C build/project-transformation-autotools \
            tests/evo_project_transformation_test
          build/project-transformation-autotools/tests/evo_project_transformation_test

      - name: Validate C fixtures and independent goldens
        run: |
          gcc -std=c17 -Wall -Wextra -Wpedantic -Wconversion \
            -Wsign-conversion -Wshadow -Werror -fsyntax-only \
            tests/fixtures/project-transformation/before.c \
            tests/fixtures/project-transformation/after.c
          python3 tests/validate_project_transformation.py
