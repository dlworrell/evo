name: Candidate Autoformat

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format candidate C sources
        shell: bash
        run: |
          clang-format -i \
            src/project_candidate.c \
            src/project_candidate_model.c \
            src/project_candidate_runtime.c \
            src/internal/project_candidate.h \
            src/internal/project_candidate_owner.h \
            src/internal/project_candidate_internal.h \
            tests/project_candidate_test.c
          if git diff --quiet; then
            echo "Candidate sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/project_candidate.c \
            src/project_candidate_model.c \
            src/project_candidate_runtime.c \
            src/internal/project_candidate.h \
            src/internal/project_candidate_owner.h \
            src/internal/project_candidate_internal.h \
            tests/project_candidate_test.c
          git commit -m "style: apply clang-format to candidate sources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
