name: Project Search

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/project_search*.c'
      - 'src/internal/project_search*.h'
      - 'tests/project_search_test.c'
      - 'tests/validate_project_search.py'
      - 'docs/adr/ADR-0042-structured-recipe-evolution.md'
      - 'docs/engineering/reports/EVO-HRA-014-structured-recipe-evolution-audit.md'
      - 'docs/schemas/evo-project-search-v1.schema.json'
      - 'docs/roadmap.md'
      - 'docs/architecture.md'
      - 'docs/algorithms.md'
      - 'docs/specs/EVO-001-library-contract.md'
      - 'docs/specs/EVO-002-source-optimizer-contract.md'
      - 'README.md'
      - 'repo.yaml'
      - '.aems/aes-bld-001.json'
      - 'CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - 'Makefile.am'
      - 'configure.ac'
      - '.github/workflows/project-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure with Clang and sanitizers
        run: cmake -S . -B build-search -DCMAKE_C_COMPILER=clang -DEVO_ENABLE_SANITIZERS=ON
      - name: Build structured search target
        run: cmake --build build-search --target evo_project_search_test --parallel 2
      - name: Run structured search target
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-search -R '^evo_project_search_test$' --output-on-failure
      - name: Independent structured search validation
        run: python3 tests/validate_project_search.py
      - name: Build complete project foundation
        run: cmake --build build-search --target catalyst_evo_project_foundation --parallel 2

  autotools-gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap Autotools
        run: autoreconf -fi
      - name: Configure with GCC
        run: ./configure CC=gcc
      - name: Build structured search test
        run: make -j2 tests/evo_project_search_test
      - name: Run normative structured search check
        run: make check TESTS=tests/evo_project_search_test
      - name: Independent structured search validation
        run: python3 tests/validate_project_search.py

  cmake-macos-clang:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure with Apple Clang
        run: cmake -S . -B build-search -DCMAKE_C_COMPILER=clang
      - name: Build structured search target
        run: cmake --build build-search --target evo_project_search_test --parallel 2
      - name: Run structured search target
        run: ctest --test-dir build-search -R '^evo_project_search_test$' --output-on-failure
      - name: Independent structured search validation
        run: python3 tests/validate_project_search.py
