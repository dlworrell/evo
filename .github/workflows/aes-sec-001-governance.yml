name: AES-SEC-001 Governance

on:
  pull_request:
  push:
    branches:
      - main
      - dev-daily
      - fitment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    uses: dlworrell/AEMS/.github/workflows/aes-sec-001-distributed.yml@280208a6ee803a381204237e570c9322e413257e # AEMS main, 2026-11-07
    with:
      # The rea/ scope (ADR-0046 Amendment 1) is scanned by its own job below;
      # the repository-level scan covers the remainder (Catylist ADR-0004 rule 5).
      exclude_paths: rea
      include_dangerous_primitives: true
      strict: true

  rea:
    uses: dlworrell/AEMS/.github/workflows/aes-sec-001-distributed.yml@280208a6ee803a381204237e570c9322e413257e # AEMS main, 2026-11-07
    with:
      scan_root: rea
      evidence_name: rea
      include_dangerous_primitives: true
      strict: true
