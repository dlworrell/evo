name: Structured Search Scaffold Sync

on:
  push:
    branches:
      - agent/evolve-compatible-source-recipes
    paths:
      - 'tests/validate_project_search.py'
      - '.github/workflows/search-scaffold-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evolve-compatible-source-recipes
          fetch-depth: 0
      - name: Correct validator type name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/validate_project_search.py')
          text = path.read_text()
          text = text.replace(
              'require("evo_search_mutable_recipe" in internal, "structured mutable recipe missing")',
              'require("evo_project_search_mutable_recipe" in internal, "structured mutable recipe missing")',
          )
          path.write_text(text)
          PY
          rm -f .github/search-validator-diagnostic.txt
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A tests/validate_project_search.py .github/search-validator-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'test: correct structured search validator type check'
            git push origin HEAD:agent/evolve-compatible-source-recipes
          fi
      - name: Verify validator
        run: python3 tests/validate_project_search.py
