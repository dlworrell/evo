name: Structured Search Finalize Sync

on:
  push:
    branches:
      - agent/evolve-compatible-source-recipes
    paths:
      - '.github/workflows/search-scaffold-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/evolve-compatible-source-recipes
          fetch-depth: 0

      - name: Finalize structured search release boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found')
              return text.replace(old, new, 1)

          # Release version parity.
          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          text = replace_once(
              text,
              'project(catalyst_evo VERSION 0.40.0 LANGUAGES C)',
              'project(catalyst_evo VERSION 0.41.0 LANGUAGES C)',
              'CMake version',
          )
          cmake.write_text(text)

          configure = Path('configure.ac')
          text = configure.read_text()
          text = replace_once(text, '  [0.40.0],', '  [0.41.0],', 'Autotools version')
          configure.write_text(text)

          # AES-BLD-001 inventory parity.
          manifest_path = Path('.aems/aes-bld-001.json')
          manifest = json.loads(manifest_path.read_text())
          sources = manifest['build']['production_sources']
          source_marker = 'src/project_measurement.c'
          if source_marker not in sources:
              raise SystemExit('AES-BLD source marker missing')
          insert_at = sources.index(source_marker) + 1
          for source in (
              'src/project_search_model.c',
              'src/project_search_runtime.c',
              'src/project_search.c',
          ):
              if source not in sources:
                  sources.insert(insert_at, source)
                  insert_at += 1

          tests = manifest['build']['normative_tests']
          if not any(item.get('id') == 'project-search' for item in tests):
              marker_index = next(
                  (index for index, item in enumerate(tests)
                   if item.get('id') == 'project-measurement'),
                  None,
              )
              if marker_index is None:
                  raise SystemExit('AES-BLD project-measurement test marker missing')
              tests.insert(
                  marker_index + 1,
                  {
                      'id': 'project-search',
                      'source': 'tests/project_search_test.c',
                      'cmake': 'evo_project_search_test',
                      'autotools': 'tests/evo_project_search_test',
                  },
              )
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          # Expand the normative fixture to prove a canonical recipe can span
          # multiple files while retaining analysis provenance.
          test_path = Path('tests/project_search_test.c')
          text = test_path.read_text()
          text = replace_once(
              text,
              '''    char source_path[320];\n    char *permitted_roots[1];\n    evo_project_file_record_t file;\n''',
              '''    char source_path_a[320];\n    char source_path_b[320];\n    char *permitted_roots[2];\n    evo_project_file_record_t files[2];\n''',
              'fixture storage',
          )
          text = replace_once(
              text,
              '''static const unsigned char test_source_bytes[] =\n    "static int unit_value(void) { return 1; }\\n";\n''',
              '''static const unsigned char test_source_bytes[] =\n    "static int unit_value(void) { return 1; }\\n";\nstatic const unsigned char test_helper_source_bytes[] =\n    "static int helper_value(void) { return 2; }\\n";\n''',
              'helper source fixture',
          )
          text = replace_once(
              text,
              '''    {"location-b",\n     "unit.c",\n''',
              '''    {"location-b",\n     "helper.c",\n''',
              'second-file location',
          )
          text = replace_once(
              text,
              '''    written = evo_project_format(\n        fixture->source_path,\n        sizeof(fixture->source_path),\n        "%s/unit.c",\n        fixture->directory);\n    if (written <= 0 || (size_t)written >= sizeof(fixture->source_path)) {\n        return false;\n    }\n''',
              '''    written = evo_project_format(\n        fixture->source_path_a,\n        sizeof(fixture->source_path_a),\n        "%s/unit.c",\n        fixture->directory);\n    if (written <= 0 || (size_t)written >= sizeof(fixture->source_path_a)) {\n        return false;\n    }\n    written = evo_project_format(\n        fixture->source_path_b,\n        sizeof(fixture->source_path_b),\n        "%s/helper.c",\n        fixture->directory);\n    if (written <= 0 || (size_t)written >= sizeof(fixture->source_path_b)) {\n        return false;\n    }\n''',
              'fixture paths',
          )
          text = replace_once(
              text,
              '''    file_descriptor = open(\n        fixture->source_path,\n        O_WRONLY | O_CREAT | O_EXCL | O_NOFOLLOW | O_CLOEXEC,\n        0600);\n    if (file_descriptor < 0 ||\n        !test_write_all(\n            file_descriptor,\n            test_source_bytes,\n            sizeof(test_source_bytes) - 1U) ||\n        fsync(file_descriptor) != 0 || close(file_descriptor) != 0 ||\n        chmod(fixture->source_path, 0400) != 0 ||\n        chmod(fixture->directory, 0500) != 0) {\n        if (file_descriptor >= 0) {\n            (void)close(file_descriptor);\n        }\n        return false;\n    }\n''',
              '''    file_descriptor = open(\n        fixture->source_path_a,\n        O_WRONLY | O_CREAT | O_EXCL | O_NOFOLLOW | O_CLOEXEC,\n        0600);\n    if (file_descriptor < 0 ||\n        !test_write_all(\n            file_descriptor,\n            test_source_bytes,\n            sizeof(test_source_bytes) - 1U) ||\n        fsync(file_descriptor) != 0 || close(file_descriptor) != 0) {\n        if (file_descriptor >= 0) {\n            (void)close(file_descriptor);\n        }\n        return false;\n    }\n    file_descriptor = open(\n        fixture->source_path_b,\n        O_WRONLY | O_CREAT | O_EXCL | O_NOFOLLOW | O_CLOEXEC,\n        0600);\n    if (file_descriptor < 0 ||\n        !test_write_all(\n            file_descriptor,\n            test_helper_source_bytes,\n            sizeof(test_helper_source_bytes) - 1U) ||\n        fsync(file_descriptor) != 0 || close(file_descriptor) != 0) {\n        if (file_descriptor >= 0) {\n            (void)close(file_descriptor);\n        }\n        return false;\n    }\n    if (chmod(fixture->source_path_a, 0400) != 0 ||\n        chmod(fixture->source_path_b, 0400) != 0 ||\n        chmod(fixture->directory, 0500) != 0) {\n        return false;\n    }\n''',
              'fixture file creation',
          )
          text = replace_once(
              text,
              '''    evo_project_fingerprint_begin(&fingerprint);\n    evo_project_fingerprint_bytes(\n        &fingerprint, test_source_bytes, sizeof(test_source_bytes) - 1U);\n    fixture->permitted_roots[0] = "unit.c";\n    fixture->file.path = "unit.c";\n    fixture->file.size = sizeof(test_source_bytes) - 1U;\n    fixture->file.source_mode = 0400U;\n    fixture->file.content_fingerprint = fingerprint.value;\n    fixture->baseline_owner.manifest.permitted_roots = fixture->permitted_roots;\n    fixture->baseline_owner.manifest.permitted_root_count = 1U;\n    fixture->baseline_owner.manifest.budget.max_files = 4U;\n    fixture->baseline_owner.manifest.budget.max_file_bytes = 4096U;\n    fixture->baseline_owner.manifest.budget.max_total_bytes = 4096U;\n    fixture->baseline_owner.manifest.budget.max_path_bytes = 256U;\n    fixture->baseline_owner.manifest.budget.max_evidence_bytes = 65536U;\n    fixture->baseline_owner.snapshot_path = fixture->directory;\n    fixture->baseline_owner.files = &fixture->file;\n    fixture->baseline_owner.file_count = 1U;\n    fixture->baseline_owner.total_file_bytes = fixture->file.size;\n''',
              '''    evo_project_fingerprint_begin(&fingerprint);\n    evo_project_fingerprint_bytes(\n        &fingerprint, test_source_bytes, sizeof(test_source_bytes) - 1U);\n    fixture->permitted_roots[0] = "unit.c";\n    fixture->files[0].path = "unit.c";\n    fixture->files[0].size = sizeof(test_source_bytes) - 1U;\n    fixture->files[0].source_mode = 0400U;\n    fixture->files[0].content_fingerprint = fingerprint.value;\n    evo_project_fingerprint_begin(&fingerprint);\n    evo_project_fingerprint_bytes(\n        &fingerprint,\n        test_helper_source_bytes,\n        sizeof(test_helper_source_bytes) - 1U);\n    fixture->permitted_roots[1] = "helper.c";\n    fixture->files[1].path = "helper.c";\n    fixture->files[1].size = sizeof(test_helper_source_bytes) - 1U;\n    fixture->files[1].source_mode = 0400U;\n    fixture->files[1].content_fingerprint = fingerprint.value;\n    fixture->baseline_owner.manifest.permitted_roots = fixture->permitted_roots;\n    fixture->baseline_owner.manifest.permitted_root_count = 2U;\n    fixture->baseline_owner.manifest.budget.max_files = 4U;\n    fixture->baseline_owner.manifest.budget.max_file_bytes = 4096U;\n    fixture->baseline_owner.manifest.budget.max_total_bytes = 4096U;\n    fixture->baseline_owner.manifest.budget.max_path_bytes = 256U;\n    fixture->baseline_owner.manifest.budget.max_evidence_bytes = 65536U;\n    fixture->baseline_owner.snapshot_path = fixture->directory;\n    fixture->baseline_owner.files = fixture->files;\n    fixture->baseline_owner.file_count = 2U;\n    fixture->baseline_owner.total_file_bytes =\n        fixture->files[0].size + fixture->files[1].size;\n''',
              'fixture baseline records',
          )
          text = replace_once(
              text,
              '''    (void)chmod(fixture->directory, 0700);\n    (void)unlink(fixture->source_path);\n    (void)rmdir(fixture->directory);\n''',
              '''    (void)chmod(fixture->directory, 0700);\n    (void)unlink(fixture->source_path_a);\n    (void)unlink(fixture->source_path_b);\n    (void)rmdir(fixture->directory);\n''',
              'fixture cleanup',
          )
          text = replace_once(
              text,
              '''    if (parent.private_owner == NULL || parameter_parent.private_owner == NULL) {\n        goto finish;\n    }\n''',
              '''    test_check(\n        parent.record_count == 2U &&\n            strcmp(parent.records[0].target.file, "unit.c") == 0 &&\n            strcmp(parent.records[1].target.file, "helper.c") == 0 &&\n            parent.records[0].compiler_record_count == 1U &&\n            parent.records[1].compiler_record_count == 1U &&\n            parent.records[1].runtime_record_count == 1U,\n        "structured recipe spans multiple files with provenance");\n    if (parent.private_owner == NULL || parameter_parent.private_owner == NULL) {\n        goto finish;\n    }\n''',
              'multi-file provenance assertion',
          )
          test_path.write_text(text)
          PY

          clang-format -i tests/project_search_test.c

      - name: Verify CMake Clang search boundary
        run: |
          cmake -S . -B build-search -DCMAKE_C_COMPILER=clang -DEVO_ENABLE_SANITIZERS=ON
          cmake --build build-search --target evo_project_search_test --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir build-search -R '^evo_project_search_test$' --output-on-failure
          python3 tests/validate_project_search.py

      - name: Verify Autotools GCC search boundary
        run: |
          autoreconf -fi
          ./configure CC=gcc
          make -j2 tests/evo_project_search_test
          make check TESTS=tests/evo_project_search_test

      - name: Commit final structured search integration
        run: |
          rm -f \
            .github/workflows/search-scaffold-sync.yml \
            .github/workflows/search-trace-sync.yml \
            .github/search-test-diagnostic.txt \
            .github/search-validator-diagnostic.txt
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A \
            .aems/aes-bld-001.json \
            CMakeLists.txt \
            configure.ac \
            tests/project_search_test.c \
            .github/workflows/search-scaffold-sync.yml \
            .github/workflows/search-trace-sync.yml \
            .github/search-test-diagnostic.txt \
            .github/search-validator-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build: finalize EVO 0.41 structured search boundary'
            git push origin HEAD:agent/evolve-compatible-source-recipes
          fi
