name: Structured Search Scaffold Sync

on:
  push:
    branches:
      - agent/evolve-compatible-source-recipes
    paths:
      - 'src/project_search*.c'
      - 'src/internal/project_search*.h'
      - 'tests/project_search_test.c'
      - 'tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'Makefile.am'
      - '.github/workflows/search-scaffold-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evolve-compatible-source-recipes
          fetch-depth: 0
      - name: Fix and canonicalize structured search test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/project_search_test.c')
          text = path.read_text()
          if '#include <stdlib.h>' not in text:
              text = text.replace('#include <stdio.h>\n', '#include <stdio.h>\n#include <stdlib.h>\n', 1)
          path.write_text(text)
          PY
          rm -f .github/search-test-diagnostic.txt
          clang-format -i \
            src/internal/project_search.h \
            src/internal/project_search_owner.h \
            src/internal/project_search_internal.h \
            src/project_search_model.c \
            src/project_search_runtime.c \
            src/project_search.c \
            tests/project_search_test.c
      - name: Commit portability fix
        run: |
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A .github/search-test-diagnostic.txt tests/project_search_test.c src/internal/project_search.h src/internal/project_search_owner.h src/internal/project_search_internal.h src/project_search_model.c src/project_search_runtime.c src/project_search.c
          if ! git diff --cached --quiet; then
            git commit -m 'test: fix structured search fixture portability'
            git push origin HEAD:agent/evolve-compatible-source-recipes
          fi
      - name: Verify CMake normative test
        run: |
          set +e
          {
            cmake -S . -B build-search -DCMAKE_C_COMPILER=clang
            cmake --build build-search --target evo_project_search_test --parallel 2
            ctest --test-dir build-search -R '^evo_project_search_test$' --output-on-failure
          } > /tmp/search-test-diagnostic.txt 2>&1
          status=$?
          cat /tmp/search-test-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            cp /tmp/search-test-diagnostic.txt .github/search-test-diagnostic.txt
            git add .github/search-test-diagnostic.txt
            git commit -m 'diagnostic: capture structured search test failure'
            git push origin HEAD:agent/evolve-compatible-source-recipes
            exit "$status"
          fi
      - name: Verify Autotools normative test
        run: |
          autoreconf -fi
          ./configure CC=gcc
          make -j2 tests/evo_project_search_test
          make check TESTS=tests/evo_project_search_test
