name: Structured Search Scaffold Sync

on:
  push:
    branches:
      - agent/evolve-compatible-source-recipes
    paths:
      - 'src/project_search*.c'
      - 'src/internal/project_search*.h'
      - 'tests/project_search_test.c'
      - 'tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'Makefile.am'
      - '.github/workflows/search-scaffold-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evolve-compatible-source-recipes
          fetch-depth: 0
      - name: Clean diagnostic residue
        run: |
          rm -f .github/search-test-diagnostic.txt
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add -A .github/search-test-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: clear structured search diagnostic'
            git push origin HEAD:agent/evolve-compatible-source-recipes
          fi
      - name: Add local status diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/project_search_test.c')
          text = path.read_text()
          needle = '        test_check(status == EVO_PROJECT_RECIPE_SUCCESS, "structured mutation succeeds");'
          replacement = '''        if (status != EVO_PROJECT_RECIPE_SUCCESS) {\n            (void)fprintf(stderr, "structured operation %s status: %s\\n", evo_project_search_operator_kind_name(operations[index]), evo_project_recipe_status_name(status));\n        }\n''' + needle
          if needle in text and 'structured operation %s status' not in text:
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          clang-format -i tests/project_search_test.c
      - name: Verify CMake normative test
        run: |
          set +e
          {
            cmake -S . -B build-search -DCMAKE_C_COMPILER=clang
            cmake --build build-search --target evo_project_search_test --parallel 2
            ctest --test-dir build-search -R '^evo_project_search_test$' --output-on-failure
          } > /tmp/search-test-diagnostic.txt 2>&1
          status=$?
          cat /tmp/search-test-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            cp /tmp/search-test-diagnostic.txt .github/search-test-diagnostic.txt
            git checkout -- tests/project_search_test.c
            git add .github/search-test-diagnostic.txt
            git commit -m 'diagnostic: capture structured operator status'
            git push origin HEAD:agent/evolve-compatible-source-recipes
            exit "$status"
          fi
      - name: Verify Autotools normative test
        run: |
          git checkout -- tests/project_search_test.c
          autoreconf -fi
          ./configure CC=gcc
          make -j2 tests/evo_project_search_test
          make check TESTS=tests/evo_project_search_test
