name: Issue 67 Automake Parity Fix

on:
  push:
    branches:
      - agent/issue-67-product-commands

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-67-product-commands
          fetch-depth: 0
      - name: Move command ownership into top-level Makefile.am
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Makefile.am")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "\tsrc/internal/project_orchestration_checkpoint.h \\\n\ttests/research/seed_schedule_research.h",
                  "\tsrc/internal/project_orchestration_checkpoint.h \\\n\tsrc/internal/project_command.h \\\n\ttests/research/seed_schedule_research.h",
              ),
              (
                  "\tsrc/project_orchestration.c \\\n\tsrc/project_orchestration_checkpoint.c\nlibevo_project_foundation_la_LIBADD",
                  "\tsrc/project_orchestration.c \\\n\tsrc/project_orchestration_checkpoint.c \\\n\tsrc/project_command.c\nlibevo_project_foundation_la_LIBADD",
              ),
              (
                  "\ttests/evo_project_orchestration_checkpoint_test \\\n\ttests/evo_project_orchestration_resume_test \\\n\tbenchmarks/evo_core_benchmark",
                  "\ttests/evo_project_orchestration_checkpoint_test \\\n\ttests/evo_project_orchestration_resume_test \\\n\ttests/evo_project_command_test \\\n\tbenchmarks/evo_core_benchmark",
              ),
              (
                  "tests_evo_project_orchestration_resume_test_LDADD = \\\n\tlibevo_project_foundation.la\n\nbenchmarks_evo_core_benchmark_SOURCES",
                  "tests_evo_project_orchestration_resume_test_LDADD = \\\n\tlibevo_project_foundation.la\n\ntests_evo_project_command_test_SOURCES = tests/project_command_test.c\ntests_evo_project_command_test_LDADD = libevo_project_foundation.la\n\nbenchmarks_evo_core_benchmark_SOURCES",
              ),
              (
                  "\tdocs/engineering/reports/EVO-HRA-013-candidate-performance-fitness-audit.md \\\n\ttests/project_candidate.cmake",
                  "\tdocs/engineering/reports/EVO-HRA-013-candidate-performance-fitness-audit.md \\\n\tdocs/adr/ADR-0044-built-in-production-providers.md \\\n\tdocs/adr/ADR-0045-product-command-contract.md \\\n\tdocs/specs/EVO-002A-product-command-provider-addendum.md \\\n\tdocs/specs/EVO-003-product-command-contract.md \\\n\tdocs/engineering/reports/EVO-HRA-016-product-command-audit.md \\\n\tdocs/schemas/evo-command-analyze-v1.schema.json \\\n\tdocs/schemas/evo-command-evolve-v1.schema.json \\\n\tdocs/schemas/evo-command-replay-v1.schema.json \\\n\tdocs/schemas/evo-command-report-v1.schema.json \\\n\ttests/test_product_command_schemas.py \\\n\ttests/project_candidate.cmake",
              ),
              (
                  "\ninclude build-aux/product-command.am\n",
                  "\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one Makefile.am match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text.rstrip("\n") + "\n", encoding="utf-8")
          PY
          rm build-aux/product-command.am
          autoreconf -fi
          ./configure CC=gcc >/dev/null
          make -j2 tests/evo_project_command_test >/dev/null
          make check TESTS=tests/evo_project_command_test
      - name: Remove one-shot workflow
        run: rm .github/workflows/issue-67-automake-parity-fix.yml
      - name: Commit literal Automake parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile.am
          git add -u build-aux/product-command.am
          git add -u .github/workflows/issue-67-automake-parity-fix.yml
          git diff --cached --check
          git commit -m 'Make product command Automake ownership explicit'
          git push origin HEAD:agent/issue-67-product-commands
