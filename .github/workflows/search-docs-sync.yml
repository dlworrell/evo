name: Structured Search Documentation Sync

on:
  push:
    branches:
      - agent/evolve-compatible-source-recipes
    paths:
      - '.github/workflows/search-docs-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/evolve-compatible-source-recipes
          fetch-depth: 0
      - name: Synchronize 0.41 product records
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: {label} marker missing')
              file.write_text(text.replace(old, new, 1))

          # README release, audit, roadmap, counts, and current boundary.
          replace_once(
              'README.md',
              '- `docs/adr/ADR-0041-reproducible-candidate-performance-fitness.md`\n',
              '- `docs/adr/ADR-0041-reproducible-candidate-performance-fitness.md`\n- `docs/adr/ADR-0042-structured-recipe-evolution.md`\n',
              'ADR list')
          replace_once(
              'README.md',
              '''fitness, and JSON/Markdown preserve every sample, exclusion, aggregate, and\nfitness derivation. EVO-HRA-013 retains this measurement-specific audit.\n''',
              '''fitness, and JSON/Markdown preserve every sample, exclusion, aggregate, and\nfitness derivation. EVO-HRA-013 retains this measurement-specific audit.\nADR-0042 assesses 0.41.0 structured recipe evolution: canonical recipe genomes,\ncomplete ordered operator events, lineage records, and exact evaluation-provider\noutcomes remain authority. Mutation and crossover operate only on whole recipe\nrecords and typed parameters, fixed seeds replay the same search, exact ties\nretain stable earlier winners, and no cache, compressed population, index, or\nprobabilistic shortcut can accept, reject, rank, or select a candidate.\nEVO-HRA-014 retains this structured-search audit.\n''',
              'HRA-014 summary')
          replace_once(
              'README.md',
              '''- Implemented reproducible baseline-versus-candidate performance measurement\n  and finite fitness mapping\n- Bounded parallel compilation, checkpoint/resume, and deterministic replay\n''',
              '''- Implemented reproducible baseline-versus-candidate performance measurement\n  and finite fitness mapping\n- Implemented deterministic structured recipe evolution and bounded search\n  with complete operator/lineage evidence and stable exact-tie semantics\n- Bounded parallel compilation, checkpoint/resume, and deterministic replay\n''',
              'source optimizer roadmap')
          replace_once(
              'README.md',
              '''and finite EVO fitness only for complete stable evidence. Whole-run\norchestration and the installed executable remain dependency-ordered roadmap\nwork; their absence is an explicit boundary, not an implicit feature claim.\n''',
              '''and finite EVO fitness only for complete stable evidence. Version 0.41.0 adds\ndeterministic structured recipe populations, whole-record/typed-parameter\nmutation and crossover, exact repair/rejection policy, complete operator and\nlineage evidence, and fixed-seed replay through the measurement/fitness boundary.\nBounded external-process orchestration and the installed executable remain\ndependency-ordered roadmap work; their absence is an explicit boundary, not an\nimplicit feature claim.\n''',
              'private foundation summary')
          replace_once(
              'README.md',
              '''installed-core sources, 24 private source-foundation sources, and 39\nnormative tests.''',
              '''installed-core sources, 27 private source-foundation sources, and 40\nnormative tests.''',
              'build inventory counts')
          replace_once(
              'README.md',
              '''**Current implementation boundary:** EVO 0.40.0 packages the deterministic\nevolutionary-search core plus the private source-optimizer foundations for\nstrict C-project ingestion, immutable baselines, normalized Clang/LLVM\nanalysis, canonical transformation recipes, three AST-aware C\ntransformations, isolated candidate materialization, candidate assurance,\nand reproducible candidate performance measurement. Measurement consumes only\nperformance-eligible assurance evidence, executes deterministic paired\nbaseline/candidate warmup and recorded requests through a caller-supplied\nprovider, binds every sample to one exact condition identity, retains explicit\nexclusions and raw evidence, rejects incomplete or unstable measurements from\nranking, and derives finite EVO fitness from recorded component values and\ncaller-declared weights without changing correctness authority. The boundary\nremains private and uninstalled. Recipe evolution/orchestration (#65-#66),\nproduct commands and installed executable (#67/#93), artifact publication\n(#68), end-to-end proof (#69), and final stabilization (#56) remain later\ndependency-ordered work.\n''',
              '''**Current implementation boundary:** EVO 0.41.0 packages the deterministic\nevolutionary-search core plus the private source-optimizer foundations for\nstrict C-project ingestion, immutable baselines, normalized Clang/LLVM\nanalysis, canonical transformation recipes, three AST-aware C\ntransformations, isolated candidate materialization, candidate assurance,\nreproducible candidate performance measurement, and structured recipe search.\nThe search initializes canonical recipe populations from live opportunities and\nthe versioned catalogue, mutates and crosses only whole records and typed\nparameters, applies bounded deterministic repair or fail-closed rejection, and\nretains complete recipe → candidate → assurance → measurement → fitness lineage\nwith exact ordered operator events. Fixed seeds replay the same search and exact\nfitness ties preserve the earlier stable winner. The boundary remains private\nand uninstalled. Bounded external-process orchestration (#66), product commands\nand installed executable (#67/#93), artifact publication (#68), end-to-end\nproof (#69), and final stabilization (#56) remain later dependency-ordered work.\n''',
              'current implementation boundary')

          # Roadmap implementation state.
          replace_once(
              'docs/roadmap.md',
              'EVO 0.40.0 contains the completed deterministic C17 evolutionary-search core\nand the first seven private source-optimizer foundations:',
              'EVO 0.41.0 contains the completed deterministic C17 evolutionary-search core\nand the first eight private source-optimizer foundations:',
              'roadmap version/foundation count')
          replace_once(
              'docs/roadmap.md',
              '''EVO fitness only when complete stable evidence is available; correctness\nauthority remains unchanged from candidate assurance.\n''',
              '''EVO fitness only when complete stable evidence is available; correctness\nauthority remains unchanged from candidate assurance. The eighth connects\ncanonical recipe genomes to the deterministic EVO core: initialization,\nwhole-record and typed-parameter mutation/crossover, bounded deterministic\nrepair, exact rejection, complete ordered operator/lineage evidence, and\nfixed-seed strict-improvement/exact-tie replay across multiple source files.\n''',
              'eighth foundation')
          replace_once(
              'docs/roadmap.md',
              '''reproducible candidate performance measurement and fitness. Issue #65 is the\nnext dependency-ready source-optimizer implementation work.\n''',
              '''reproducible candidate performance measurement and fitness. Issue #65\nimplements deterministic structured recipe evolution and bounded search. Issue\n#66 is the next dependency-ready source-optimizer implementation work.\n''',
              'next issue')

          # Architecture boundary and HRA audit.
          replace_once(
              'docs/architecture.md',
              '''declared outlier/stability/tolerance policy, deterministic aggregates, and\nfinite EVO fitness only for complete stable evidence.\n''',
              '''declared outlier/stability/tolerance policy, deterministic aggregates, and\nfinite EVO fitness only for complete stable evidence. Version 0.41.0 adds a\nprivate structured recipe-search transaction over those foundations: canonical\nrecipe population initialization, whole-record and typed-parameter operators,\nbounded deterministic repair/rejection, exact downstream evaluation identity,\nand complete ordered operator plus generation lineage evidence.\n''',
              '0.41 architecture')
          replace_once(
              'docs/architecture.md',
              '''Version 0.40.0 contains the evolutionary-search core, its bounded reference\nconsumers, private project ingestion, a private normalized analysis and hotspot\nmodel, a private canonical transformation-recipe model, a private initial AST-\naware C transformation catalogue, private isolated candidate materialization,\nprivate candidate assurance, and private reproducible candidate measurement\nwith finite fitness mapping.''',
              '''Version 0.41.0 contains the evolutionary-search core, its bounded reference\nconsumers, private project ingestion, a private normalized analysis and hotspot\nmodel, a private canonical transformation-recipe model, a private initial AST-\naware C transformation catalogue, private isolated candidate materialization,\nprivate candidate assurance, private reproducible candidate measurement with\nfinite fitness mapping, and private deterministic structured recipe search.''',
              'conformance version')
          replace_once(
              'docs/architecture.md',
              '''Whole-run orchestration, product commands, the installed standalone executable,\nand final optimized-patch artifacts remain planned by issues #65 through #69\nand #93.''',
              '''Bounded external-process orchestration, product commands, the installed\nstandalone executable, and final optimized-patch artifacts remain planned by\nissues #66 through #69 and #93.''',
              'remaining architecture issues')
          replace_once(
              'docs/architecture.md',
              '''probabilistic ranking authority. EVO-HRA-013 audits this 0.40.0 boundary. The\ncurrent implementation therefore has no opaque accelerated authority requiring\nremediation.''',
              '''probabilistic ranking authority. EVO-HRA-013 audits this 0.40.0 boundary.\nStructured recipe search likewise uses direct bounded record/population arrays,\nexact operator events, complete lineage records, and deterministic scans; no\ncache, compressed population, lookup index, membership filter, or probabilistic\nshortcut participates in acceptance, rejection, ranking, selection, or\ntermination. EVO-HRA-014 audits this 0.41.0 boundary. The current implementation\ntherefore has no opaque accelerated authority requiring remediation.''',
              'HRA-014 architecture')

          # Algorithms current implementation.
          replace_once(
              'docs/algorithms.md',
              '''algorithm required by the EVO 1.0 source optimizer. Version 0.40.0 implements\nthe core plus project ingestion, immutable-baseline preparation, normalized\nClang/LLVM analysis and hotspot ranking, canonical transformation recipes,\nthree AST-aware source-transformation applications, deterministic isolated\ncandidate materialization, exact candidate build/correctness assurance, and\nreproducible baseline-versus-candidate performance measurement. The\nmeasurement algorithm consumes only performance-eligible assurance evidence,\nrequests deterministic alternating baseline/candidate warmup and recorded\nsamples, binds every provider result to one exact condition fingerprint,\nretains raw samples and declared exclusions, aggregates included samples by\ndeterministic median, classifies unstable/incomplete evidence without fitness,\nand maps complete stable runtime/memory/binary/reliability/maintainability\nevidence into finite EVO fitness through explicit caller weights. Recipe\nevolution and whole-run orchestration remain the next source-optimizer\nalgorithm boundary.\n''',
              '''algorithm required by the EVO 1.0 source optimizer. Version 0.41.0 implements\nthe core plus project ingestion, immutable-baseline preparation, normalized\nClang/LLVM analysis and hotspot ranking, canonical transformation recipes,\nthree AST-aware source-transformation applications, deterministic isolated\ncandidate materialization, exact candidate build/correctness assurance,\nreproducible baseline-versus-candidate performance measurement, and structured\nrecipe evolution. The search algorithm initializes canonical recipes from live\nopportunities/catalogue authority, mutates only whole records or typed\nparameters, crosses whole records rather than source bytes, applies only\nversioned bounded deterministic repair, rejects invalid recipes before\nmaterialization, and records every operator event plus complete downstream\nrecipe → candidate → assurance → measurement → fitness lineage. Fixed seeds\nreplay population/search identity; strict improvements replace the winner and\nexact ties retain the earlier stable candidate. Bounded external-process\norchestration remains the next source-optimizer algorithm boundary.\n''',
              'algorithms intro')

          # Core contract version metadata; installed semantics remain unchanged.
          replace_once(
              'docs/specs/EVO-001-library-contract.md',
              'Version: 0.40.0\n',
              'Version: 0.41.0\n',
              'EVO-001 version')
          replace_once(
              'docs/specs/EVO-001-library-contract.md',
              '''core packaged through version 0.40.0. Version 0.40.0 changes no installed\ncore semantics; its new implementation is confined to the private source-\noptimizer candidate-measurement and fitness foundation.''',
              '''core packaged through version 0.41.0. Version 0.41.0 changes no installed\ncore semantics; its new implementation is confined to the private source-\noptimizer structured recipe-search foundation.''',
              'EVO-001 scope')

          # Product contract now implemented through structured search.
          replace_once(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              'Status: Implemented through the 0.40.0 candidate-measurement boundary; draft 1.0 target\nVersion: 0.40.0\n',
              'Status: Implemented through the 0.41.0 structured recipe-search boundary; draft 1.0 target\nVersion: 0.41.0\n',
              'EVO-002 status/version')
          replace_once(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              'Governing ADRs: ADR-0016, ADR-0026, ADR-0035, ADR-0036, ADR-0037, ADR-0038, ADR-0039, ADR-0040, and ADR-0041\n',
              'Governing ADRs: ADR-0016, ADR-0026, ADR-0035, ADR-0036, ADR-0037, ADR-0038, ADR-0039, ADR-0040, ADR-0041, and ADR-0042\n',
              'EVO-002 ADRs')
          replace_once(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              '''the complete source optimizer is implemented in version 0.40.0. This release\nimplements strict project ingestion and immutable baselines, normalized\nanalysis/hotspot evidence, canonical transformation recipes, the initial AST-\naware C transformation catalogue, deterministic isolated candidate\nmaterialization, candidate build/correctness assurance, and reproducible\nbaseline-versus-candidate performance measurement with finite fitness mapping.\nAssurance and measurement consume exact results from caller-supplied providers;\nportable OS sandboxing and target workload execution remain provider\nresponsibilities. Whole-run recipe evolution/orchestration and every later\nroadmap boundary remain a 1.0 target until their issues land.\n''',
              '''the complete source optimizer is implemented in version 0.41.0. This release\nimplements strict project ingestion and immutable baselines, normalized\nanalysis/hotspot evidence, canonical transformation recipes, the initial AST-\naware C transformation catalogue, deterministic isolated candidate\nmaterialization, candidate build/correctness assurance, reproducible\nbaseline-versus-candidate performance measurement with finite fitness mapping,\nand deterministic structured recipe evolution through the reusable EVO core.\nAssurance, measurement, and search evaluation consume exact results from\ncaller-supplied providers; portable OS sandboxing and target workload execution\nremain provider responsibilities. Bounded external-process orchestration and\nevery later roadmap boundary remain a 1.0 target until their issues land.\n''',
              'EVO-002 implementation boundary')
          replace_once(
              'docs/specs/EVO-002-source-optimizer-contract.md',
              '''rewrite it. ADR-0041 and EVO-HRA-013 retain this issue-specific assessment.\n\n## Optimization Manifest\n''',
              '''rewrite it. ADR-0041 and EVO-HRA-013 retain this issue-specific assessment.\n\nThe implemented 0.41.0 structured recipe-search boundary also introduces no\naccelerator. Canonical recipe genomes, direct bounded population/record arrays,\nexact ordered operator events, complete lineage records, and exact downstream\nevaluation outcomes remain authority. Mutation/crossover do not splice source\nbytes; deterministic repair is versioned and bounded; rejected recipes cannot\nreach materialization; and fixed seeds replay the same search, rejection,\nfitness, and winner lineage. ADR-0042 and EVO-HRA-014 retain this issue-specific\nassessment.\n\n## Optimization Manifest\n''',
              'EVO-002 HRA-014')

          # Repository metadata.
          replace_once(
              'repo.yaml',
              '      status: implemented-0.40.0\n',
              '      status: implemented-0.41.0\n',
              'core metadata version')
          replace_once(
              'repo.yaml',
              '      status: performance-measurement-implemented-0.40.0\n',
              '      status: structured-recipe-search-implemented-0.41.0\n',
              'optimizer metadata version')
          PY
      - name: Commit synchronized product records
        run: |
          rm -f .github/workflows/search-docs-sync.yml
          git config user.name 'Donovan Worrell'
          git config user.email 'donovan.worrell@just-a-geek.com'
          git add \
            README.md \
            docs/roadmap.md \
            docs/architecture.md \
            docs/algorithms.md \
            docs/specs/EVO-001-library-contract.md \
            docs/specs/EVO-002-source-optimizer-contract.md \
            repo.yaml \
            .github/workflows/search-docs-sync.yml
          git commit -m 'docs: synchronize EVO 0.41 structured search boundary'
          git push origin HEAD:agent/evolve-compatible-source-recipes
