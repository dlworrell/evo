manifest_version: 1.0.0
schema_version: 1

repository:
  id: EVO
  name: Catalyst EVO
  full_name: dlworrell/evo
  owner: dlworrell
  role: evolutionary-optimization-library
  ownership: project-owned
  lifecycle: engineering-ready
  primary_branch: main
  issue_tracker: https://github.com/dlworrell/evo/issues

documentation:
  authority: local
  roots:
    - docs
    - benchmarks
    - examples

governance:
  authority_repository: dlworrell/Catylist
  standards_repository: dlworrell/AES
  dependency_direction:
    upstream:
      - dlworrell/Catylist
      - dlworrell/AES
      - dlworrell/AEMS
      - dlworrell/repo_templates
    downstream:
      - dlworrell/AEMS
      - dlworrell/atarix

standards:
  applicable:
    - AES-000
    - AES-001
    - AES-002
    - AES-003
    - AES-DEV-001
    - AES-SEC-001
    - AES-BLD-001

project_zero:
  state: ENGINEERING_READY
  certification:
    status: approved
    evidence: docs/engineering/reports/EVO-P0-002-engineering-ready-certification.md
  accepted_deferrals: []

automation:
  enabled_modules:
    - inventory
    - manifest-validation
    - issue-graph

evidence:
  output_root: build/aems/project-zero
  formats:
    - json
    - markdown

source:
  public_api: include/catalyst/evo
  implementation: src
testing:
  root: tests
benchmarks:
  root: benchmarks

# Governed project scopes (Catylist ADR-0004). Files outside every scope are the
# repository-level remainder, scanned with the scopes excluded.
scopes:
  - id: rea
    path: rea/
    owner: dlworrell
    class: engineering-application
    lifecycle: bootstrap
    origin:
      ingested_from: https://github.com/morluto/rea
      record: rea/UPSTREAM.json
      local_changes: rea/LOCAL-CHANGES.md
      decision: docs/adr/ADR-0046-rea-assisted-recovery-and-source-admission.md
    license: MIT (rea/LICENSE); EVO's own files remain Apache-2.0
    automation: rea/ci/
    standards:
      - id: AES-SEC-001
        applicability: applicable
        evidence:
          profile: rea/docs/engineering/SECURE-C-CXX.md
          waiver_log: rea/docs/engineering/AES-SEC-001-waivers.md
          review_dispositions: rea/docs/engineering/AES-SEC-001-review-dispositions.json
